<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUARDIANES · ARENA + GAMEPAD MATERIAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c0f;
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        /* ===== VISTA PC / PROYECTOR (solo canvas) ===== */
        .presentation-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        #gameCanvas {
            display: block;
            width: min(90vw, 90vh);
            aspect-ratio: 1/1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #110f1a;
            border: 4px solid #00ffff;
            border-radius: 24px;
            box-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff;
        }

        /* ===== VISTA MÓVIL GAMEPAD (solo controles Material Design) ===== */
        .gamepad-mode {
            display: none;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #121212;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px 32px;
            box-shadow: inset 0 0 20px rgba(0,255,255,0.2);
        }

        /* Header Material */
        .gamepad-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .gamepad-title {
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow: 0 0 10px cyan;
            margin-bottom: 8px;
        }

        .player-chip {
            background: #2c2c2c;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .player-chip span {
            color: white;
            font-size: 1rem;
        }

        .chip-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 15px cyan;
        }

        /* Joystick Material */
        .joystick-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 240px;
        }

        .md-joystick {
            width: 200px;
            height: 200px;
            background: #1e1e1e;
            border-radius: 999px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.5),
                0 0 0 2px #333,
                inset 0 -3px 0 rgba(0,0,0,0.3);
            touch-action: none;
        }

        .md-joystick-thumb {
            width: 90px;
            height: 90px;
            background: #6200ee;
            border-radius: 999px;
            box-shadow: 
                0 8px 12px rgba(98, 0, 238, 0.4),
                0 0 0 2px #bb86fc;
            transition: transform 0.05s ease;
            touch-action: none;
        }

        /* Botones Material Design */
        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 24px 0;
            padding: 0 8px;
        }

        .md-button {
            background: #6200ee;
            border: none;
            border-radius: 56px;
            padding: 24px 0;
            color: white;
            font-size: 2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 
                0 8px 12px 0 rgba(98, 0, 238, 0.3),
                0 4px 4px rgba(0,0,0,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.2);
            touch-action: manipulation;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .md-button:active {
            transform: translateY(4px);
            box-shadow: 
                0 4px 8px 0 rgba(98, 0, 238, 0.3),
                0 2px 4px rgba(0,0,0,0.3);
        }

        .md-button.secondary {
            background: #03dac6;
            color: #000;
            box-shadow: 0 8px 12px 0 rgba(3, 218, 198, 0.3);
        }

        /* Estado de conexión */
        .connection-status {
            background: #1e1e1e;
            border-radius: 28px;
            padding: 16px;
            margin-top: 8px;
            text-align: center;
            color: #bb86fc;
            font-size: 0.9rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .health-material {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .health-dot {
            width: 24px;
            height: 24px;
            border-radius: 12px;
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa;
        }

        /* Ocultar/mostrar según dispositivo */
        @media (hover: none) and (pointer: coarse) and (max-width: 1024px) {
            .presentation-mode {
                display: none;
            }
            .gamepad-mode {
                display: flex;
            }
            body {
                background: #121212;
            }
        }

        @media (hover: hover) and (pointer: fine) {
            .presentation-mode {
                display: flex;
            }
            .gamepad-mode {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- VISTA PROYECTOR / PC (SOLO CANVAS) -->
    <div class="presentation-mode">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </div>

    <!-- VISTA MÓVIL GAMEPAD (SOLO CONTROLES MATERIAL DESIGN) -->
    <div class="gamepad-mode" id="gamepadUI">
        <div class="gamepad-header">
            <div class="gamepad-title">GUARDIANES</div>
            <div class="player-chip" id="playerChip">
                <div class="chip-avatar" id="playerColor"></div>
                <span id="playerIdText">JUGADOR 1</span>
            </div>
        </div>

        <div class="health-material" id="healthBars">
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
        </div>

        <div class="joystick-container">
            <div class="md-joystick" id="joystickBase">
                <div class="md-joystick-thumb" id="joystickThumb"></div>
            </div>
        </div>

        <div class="buttons-grid">
            <button class="md-button" id="actionShoot">
                <span>🔫</span> DISPARAR
            </button>
            <button class="md-button secondary" id="actionSpecial">
                <span>🛡️</span> ESCUDO
            </button>
        </div>

        <div class="connection-status" id="connectionStatus">
            ⚡ CONECTADO A LA ARENA
        </div>
    </div>

    <script>
        (function() {
            // ========== CONFIGURACIÓN JUEGO ==========
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas?.getContext('2d');
            if (ctx) ctx.imageSmoothingEnabled = false;

            const MAX_PLAYERS = 4;
            const PLAYER_RADIUS = 20;
            const ENEMY_RADIUS = 18;
            const CANVAS_SIZE = 800;

            // Estado del juego
            let players = [];
            let enemies = [];
            let powerups = [];
            let bullets = [];
            let gameActive = true;

            // Colores neon
            const playerColors = ['#00ffff', '#ffaa00', '#ff44ee', '#00ffaa'];
            const playerStartPos = [
                {x: 200, y: 200}, {x: 600, y: 200}, {x: 200, y: 600}, {x: 600, y: 600}
            ];

            // Inicializar 4 jugadores
            for (let i = 0; i < MAX_PLAYERS; i++) {
                players.push({
                    id: `p${i}`,
                    index: i,
                    x: playerStartPos[i].x,
                    y: playerStartPos[i].y,
                    radius: PLAYER_RADIUS,
                    color: playerColors[i],
                    hp: 100,
                    maxHp: 100,
                    angle: 0,
                    shootCooldown: 0,
                    speed: 4,
                    fireRate: 15,
                    powerUp: null,
                    shield: false,
                    active: true,
                    kills: 0,
                    connected: false, // para saber si un móvil lo controla
                    moveX: 0,
                    moveY: 0,
                    shooting: false,
                    special: false
                });
            }

            // Clases
            class Enemy {
                constructor() {
                    this.radius = ENEMY_RADIUS;
                    this.x = Math.random() * CANVAS_SIZE;
                    this.y = Math.random() * CANVAS_SIZE;
                    this.hp = 40;
                    this.speed = 1.8;
                    this.color = '#ff2266';
                    this.damage = 15;
                }
            }

            class PowerUp {
                constructor(x, y, type) {
                    this.x = x; this.y = y; this.type = type;
                    this.radius = 15;
                    this.color = type === 'rapid' ? '#ffff00' : '#00ccff';
                    this.duration = 450;
                }
            }

            // ========== SISTEMA DE ASIGNACIÓN DE JUGADORES ==========
            // Los móviles que se conectan toman el control de un jugador libre
            let connectedClients = []; // guardamos los índices ocupados

            // Función para asignar un jugador a un nuevo móvil
            function assignPlayerToMobile() {
                for (let i = 0; i < players.length; i++) {
                    if (!players[i].connected) {
                        players[i].connected = true;
                        return i;
                    }
                }
                return -1; // todos ocupados
            }

            // Liberar jugador (cuando el móvil se desconecta)
            function releasePlayer(index) {
                if (index >= 0 && index < players.length) {
                    players[index].connected = false;
                    players[index].moveX = 0;
                    players[index].moveY = 0;
                    players[index].shooting = false;
                    players[index].special = false;
                }
            }

            // ========== LÓGICA DEL JUEGO (actualización) ==========
            function updateGame() {
                if (!gameActive) return;

                // Actualizar cada jugador conectado
                for (let p of players) {
                    if (!p.active) continue;

                    // Movimiento basado en controles (desde móvil o teclado PC para pruebas)
                    if (p.connected) {
                        // Movido por móvil
                        p.x += p.moveX * p.speed;
                        p.y += p.moveY * p.speed;
                    } else {
                        // Control por teclado para pruebas en PC (solo jugador 0)
                        if (p.index === 0) {
                            let moveX = 0, moveY = 0;
                            if (keys['w']) moveY -= 1;
                            if (keys['s']) moveY += 1;
                            if (keys['a']) moveX -= 1;
                            if (keys['d']) moveX += 1;
                            if (moveX !== 0 || moveY !== 0) {
                                const len = Math.hypot(moveX, moveY);
                                moveX /= len; moveY /= len;
                            }
                            p.x += moveX * p.speed;
                            p.y += moveY * p.speed;
                        }
                    }

                    // Límites
                    p.x = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.x));
                    p.y = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.y));

                    // Apuntar al enemigo más cercano (IA de apuntado)
                    let closestDist = Infinity;
                    let closestEnemy = null;
                    for (let e of enemies) {
                        const dx = e.x - p.x;
                        const dy = e.y - p.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = e;
                        }
                    }
                    if (closestEnemy) {
                        p.angle = Math.atan2(closestEnemy.y - p.y, closestEnemy.x - p.x);
                    }

                    // Disparo
                    if (p.shootCooldown <= 0) {
                        if (p.shooting && closestEnemy) {
                            bullets.push({
                                x: p.x, y: p.y,
                                vx: Math.cos(p.angle) * 8,
                                vy: Math.sin(p.angle) * 8,
                                owner: p.index,
                                radius: 5
                            });
                            p.shootCooldown = (p.powerUp?.type === 'rapid') ? 4 : 12;
                        }
                    } else {
                        p.shootCooldown--;
                    }

                    // Escudo (activado con special)
                    p.shield = (p.special && p.powerUp?.type === 'shield');
                }

                // Actualizar balas
                for (let i = bullets.length-1; i>=0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x < 0 || b.x > CANVAS_SIZE || b.y < 0 || b.y > CANVAS_SIZE) {
                        bullets.splice(i,1);
                        continue;
                    }
                    for (let j=enemies.length-1; j>=0; j--) {
                        let e = enemies[j];
                        const dx = b.x - e.x;
                        const dy = b.y - e.y;
                        if (Math.hypot(dx, dy) < e.radius + b.radius) {
                            e.hp -= 25;
                            bullets.splice(i,1);
                            if (e.hp <= 0) {
                                enemies.splice(j,1);
                                if (b.owner !== undefined) players[b.owner].kills++;
                            }
                            break;
                        }
                    }
                }

                // Mover enemigos hacia jugadores
                for (let e of enemies) {
                    // buscar jugador más cercano
                    let target = null;
                    let minDist = Infinity;
                    for (let p of players) {
                        if (!p.active) continue;
                        const d = Math.hypot(p.x - e.x, p.y - e.y);
                        if (d < minDist) {
                            minDist = d;
                            target = p;
                        }
                    }
                    if (target) {
                        const dx = target.x - e.x;
                        const dy = target.y - e.y;
                        if (minDist > 5) {
                            e.x += (dx / minDist) * e.speed;
                            e.y += (dy / minDist) * e.speed;
                        }
                        // daño por colisión
                        if (minDist < e.radius + target.radius) {
                            if (!target.shield) {
                                target.hp = Math.max(0, target.hp - e.damage);
                            }
                            e.x -= (dx / minDist) * 30;
                            e.y -= (dy / minDist) * 30;
                        }
                    }
                }

                // Power-ups
                for (let i=powerups.length-1; i>=0; i--) {
                    let pu = powerups[i];
                    for (let p of players) {
                        if (!p.active) continue;
                        const dx = pu.x - p.x;
                        const dy = pu.y - p.y;
                        if (Math.hypot(dx, dy) < pu.radius + p.radius) {
                            p.powerUp = {type: pu.type, timeLeft: pu.duration};
                            powerups.splice(i,1);
                            break;
                        }
                    }
                }

                // Expirar power-ups
                for (let p of players) {
                    if (p.powerUp) {
                        p.powerUp.timeLeft--;
                        if (p.powerUp.timeLeft <= 0) {
                            p.powerUp = null;
                            p.shield = false;
                        }
                    }
                }

                // Dibujar canvas (solo en PC)
                if (ctx) {
                    drawCanvas();
                }

                // Actualizar UI del gamepad si existe (para móvil)
                updateGamepadUI();

                requestAnimationFrame(updateGame);
            }

            function drawCanvas() {
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                // Fondo grid
                ctx.fillStyle = '#110a1f';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                for (let i=0; i<CANVAS_SIZE; i+=40) {
                    ctx.strokeStyle = '#00ff9966';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(i,0); ctx.lineTo(i, CANVAS_SIZE);
                    ctx.strokeStyle = '#ff00aa33';
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0,i); ctx.lineTo(CANVAS_SIZE, i);
                    ctx.stroke();
                }

                // Powerups
                for (let pu of powerups) {
                    ctx.beginPath();
                    ctx.arc(pu.x, pu.y, pu.radius, 0, 2*Math.PI);
                    ctx.fillStyle = pu.color;
                    ctx.shadowColor = pu.color;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = "bold 20px 'Courier New'";
                    ctx.fillStyle = 'white';
                    ctx.fillText(pu.type==='rapid'?'⚡':'🛡️', pu.x-15, pu.y+8);
                }

                // Enemigos
                for (let e of enemies) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, 2*Math.PI);
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'black';
                    ctx.font = "20px 'Courier New'";
                    ctx.fillText('💲', e.x-12, e.y+8);
                }

                // Jugadores
                for (let p of players) {
                    if (!p.active) continue;
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    if (p.shield) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius+10, 0, 2*Math.PI);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.font = "22px 'Courier New'";
                    ctx.fillText('🛡️', p.x-14, p.y+10);
                    
                    // Indicador de conexión (si es controlado por móvil)
                    if (p.connected) {
                        ctx.fillStyle = '#00ff00';
                        ctx.beginPath();
                        ctx.arc(p.x-25, p.y-25, 8, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }

                // Balas
                for (let b of bullets) {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffff00';
                    ctx.fillRect(b.x-3, b.y-3, 6, 6);
                }
                ctx.shadowBlur = 0;
            }

            // Actualizar la UI del gamepad (vista móvil)
            function updateGamepadUI() {
                // Esta función actualiza los indicadores del gamepad
                // (vida, jugador asignado, etc)
                const playerIdSpan = document.getElementById('playerIdText');
                const colorDiv = document.getElementById('playerColor');
                const healthDots = document.querySelectorAll('.health-dot');
                
                // Buscar qué jugador tiene este móvil (simulado: asignamos el primero no conectado)
                // En un entorno real, esto se manejaría con websockets.
                // Simulamos que el primer móvil que carga agarra el jugador 0
                if (!window.myPlayerIndex) {
                    window.myPlayerIndex = 0; // por defecto
                    players[0].connected = true;
                }
                
                const myPlayer = players[window.myPlayerIndex];
                if (myPlayer) {
                    playerIdSpan.innerText = `JUGADOR ${window.myPlayerIndex+1}`;
                    colorDiv.style.background = myPlayer.color;
                    
                    // actualizar vida (5 dots)
                    const healthPercent = myPlayer.hp / myPlayer.maxHp;
                    const activeDots = Math.ceil(healthPercent * 5);
                    healthDots.forEach((dot, index) => {
                        if (index < activeDots) {
                            dot.style.background = '#00ffaa';
                            dot.style.boxShadow = '0 0 10px #00ffaa';
                        } else {
                            dot.style.background = '#333';
                            dot.style.boxShadow = 'none';
                        }
                    });
                }
            }

            // ========== CONTROLES TÁCTILES MATERIAL ==========
            const joystickBase = document.getElementById('joystickBase');
            const joystickThumb = document.getElementById('joystickThumb');
            const shootBtn = document.getElementById('actionShoot');
            const specialBtn = document.getElementById('actionSpecial');

            if (joystickBase) {
                let joystickActive = false;
                joystickBase.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                });

                joystickBase.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!joystickActive) return;
                    const touch = e.touches[0];
                    const rect = joystickBase.getBoundingClientRect();
                    const centerX = rect.left + rect.width/2;
                    const centerY = rect.top + rect.height/2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const maxDist = rect.width/2;
                    const dist = Math.hypot(dx, dy);
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    
                    // Actualizar movimiento del jugador asignado
                    if (players[window.myPlayerIndex]) {
                        players[window.myPlayerIndex].moveX = dx / maxDist;
                        players[window.myPlayerIndex].moveY = dy / maxDist;
                    }
                });

                joystickBase.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    joystickActive = false;
                    joystickThumb.style.transform = `translate(0px, 0px)`;
                    if (players[window.myPlayerIndex]) {
                        players[window.myPlayerIndex].moveX = 0;
                        players[window.myPlayerIndex].moveY = 0;
                    }
                });

                // Botones
                shootBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (players[window.myPlayerIndex]) players[window.myPlayerIndex].shooting = true;
                });
                shootBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (players[window.myPlayerIndex]) players[window.myPlayerIndex].shooting = false;
                });

                specialBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (players[window.myPlayerIndex]) players[window.myPlayerIndex].special = true;
                });
                specialBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (players[window.myPlayerIndex]) players[window.myPlayerIndex].special = false;
                });
            }

            // Teclado para pruebas en PC
            const keys = {};
            window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
            window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

            // Generar enemigos
            setInterval(() => {
                if (enemies.length < 8) {
                    enemies.push(new Enemy());
                }
            }, 2000);

            setInterval(() => {
                if (powerups.length < 3) {
                    const type = Math.random() > 0.5 ? 'rapid' : 'shield';
                    powerups.push(new PowerUp(
                        Math.random() * 700 + 50,
                        Math.random() * 700 + 50,
                        type
                    ));
                }
            }, 8000);

            // Iniciar juego
            window.myPlayerIndex = 0; // este móvil controla al jugador 0
            players[0].connected = true;
            updateGame();

            // Mostrar info de conexión
            console.log('Arena visible en PC. Móviles conéctense a esta IP:', window.location.hostname);
        })();
    </script>
</body>
</html>
