<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUARDIANES · SALA COMPARTIDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c0f;
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        /* Pantalla de sala */
        .room-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0b1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            text-align: center;
        }

        .room-title {
            font-size: 2rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 30px;
        }

        .room-input {
            background: #2a1e3a;
            border: 3px solid #ff00c6;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 2rem;
            color: white;
            text-align: center;
            width: 300px;
            margin: 20px;
            font-family: monospace;
            letter-spacing: 5px;
        }

        .room-btn {
            background: #6200ee;
            border: none;
            border-radius: 40px;
            padding: 20px 40px;
            font-size: 1.5rem;
            color: white;
            margin: 10px;
            cursor: pointer;
            border: 2px solid #bb86fc;
        }

        .room-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #6200ee;
        }

        .room-info {
            color: #bb86fc;
            margin-top: 20px;
            font-size: 1.1rem;
        }

        /* Pantalla de selección de rol */
        .role-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0b1a 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        .role-title {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 40px;
        }

        .role-buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-btn {
            padding: 30px 50px;
            border-radius: 40px;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 280px;
        }

        .arena-btn {
            background: #6200ee;
            color: white;
            border: 4px solid #bb86fc;
        }

        .controller-btn {
            background: #03dac6;
            color: black;
            border: 4px solid #00ffff;
        }

        .room-code-display {
            margin-top: 30px;
            color: #00ffff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px cyan;
        }

        /* VISTA ARENA */
        .presentation-mode {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        #gameCanvas {
            display: block;
            width: min(90vw, 90vh);
            aspect-ratio: 1/1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #110f1a;
            border: 4px solid #00ffff;
            border-radius: 24px;
            box-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff;
        }

        /* VISTA GAMEPAD */
        .gamepad-mode {
            display: none;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #121212;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px 32px;
            box-shadow: inset 0 0 20px rgba(0,255,255,0.2);
        }

        .gamepad-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .gamepad-title {
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow: 0 0 10px cyan;
            margin-bottom: 8px;
        }

        .player-chip {
            background: #2c2c2c;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .player-chip span {
            color: white;
            font-size: 1rem;
        }

        .chip-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 15px cyan;
        }

        .health-material {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .health-dot {
            width: 24px;
            height: 24px;
            border-radius: 12px;
            background: #333;
            transition: all 0.3s;
        }

        .joystick-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 240px;
        }

        .md-joystick {
            width: 200px;
            height: 200px;
            background: #1e1e1e;
            border-radius: 999px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 0 2px #333;
            touch-action: none;
        }

        .md-joystick-thumb {
            width: 90px;
            height: 90px;
            background: #6200ee;
            border-radius: 999px;
            box-shadow: 0 8px 12px rgba(98, 0, 238, 0.4), 0 0 0 2px #bb86fc;
            transition: transform 0.05s ease;
            touch-action: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 24px 0;
            padding: 0 8px;
        }

        .md-button {
            background: #6200ee;
            border: none;
            border-radius: 56px;
            padding: 24px 0;
            color: white;
            font-size: 2rem;
            text-transform: uppercase;
            box-shadow: 0 8px 12px 0 rgba(98, 0, 238, 0.3);
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .md-button:active {
            transform: translateY(4px);
        }

        .md-button.secondary {
            background: #03dac6;
            color: #000;
        }

        .connection-status {
            background: #1e1e1e;
            border-radius: 28px;
            padding: 16px;
            margin-top: 8px;
            text-align: center;
            color: #bb86fc;
            border: 1px solid #333;
        }

        .waiting-message {
            color: white;
            font-size: 1.5rem;
            margin-top: 50px;
            text-align: center;
        }

        .player-id {
            font-size: 3rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin: 20px 0;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Pantalla de sala (PRIMERO) -->
    <div class="room-screen" id="roomScreen">
        <div class="room-title">GUARDIANES DEL TERRITORIO</div>
        <div class="room-title" style="font-size: 1.2rem; color: #bb86fc;">CÓDIGO DE SALA</div>
        <input type="text" class="room-input" id="roomCodeInput" placeholder="ABC123" value="GUARD1" maxlength="6" style="text-transform: uppercase;">
        <div>
            <button class="room-btn" onclick="joinRoom()">UNIRSE A SALA</button>
            <button class="room-btn" onclick="createRoom()">CREAR NUEVA SALA</button>
        </div>
        <div class="room-info" id="roomInfo">
            Todos deben usar el MISMO código
        </div>
    </div>

    <!-- Pantalla de selección de rol -->
    <div class="role-screen" id="roleScreen">
        <div class="role-title">SALA: <span id="displayRoomCode">GUARD1</span></div>
        <div class="role-buttons">
            <button class="role-btn arena-btn" onclick="selectRole('arena')">
                🖥️ SERVIDOR (ARENA)
            </button>
            <button class="role-btn controller-btn" onclick="selectRole('controller')">
                🎮 JUGADOR (CONTROL)
            </button>
        </div>
        <div class="room-code-display" id="playerCount">Jugadores: 0/4</div>
    </div>

    <!-- VISTA ARENA -->
    <div class="presentation-mode" id="arenaView">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </div>

    <!-- VISTA GAMEPAD -->
    <div class="gamepad-mode" id="gamepadView">
        <div class="gamepad-header">
            <div class="gamepad-title">GUARDIANES · SALA <span id="gamepadRoomCode"></span></div>
            <div class="player-chip" id="playerChip">
                <div class="chip-avatar" id="playerColor"></div>
                <span id="playerIdText">CONECTANDO...</span>
            </div>
        </div>

        <div class="health-material" id="healthBars">
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
        </div>

        <div class="waiting-message" id="waitingMessage">
            ESPERANDO ASIGNACIÓN...
        </div>

        <div id="controlsContainer" style="display: none;">
            <div class="joystick-container">
                <div class="md-joystick" id="joystickBase">
                    <div class="md-joystick-thumb" id="joystickThumb"></div>
                </div>
            </div>

            <div class="buttons-grid">
                <button class="md-button" id="actionShoot">🔫 DISPARAR</button>
                <button class="md-button secondary" id="actionSpecial">🛡️ ESCUDO</button>
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">
            ⚡ CONECTANDO...
        </div>
    </div>

    <script>
        // ========== CONFIGURACIÓN FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBkYrQMU4BbDuyWxYQYgVXQYQYgVXQYQYgV", // Esta es una key de demo, en producción usa la tuya
            authDomain: "guardianes-demo.firebaseapp.com",
            databaseURL: "https://guardianes-demo-default-rtdb.firebaseio.com",
            projectId: "guardianes-demo",
            storageBucket: "guardianes-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        // Inicializar Firebase (con manejo de error si no hay conexión)
        let database = null;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log("Firebase conectado");
        } catch (e) {
            console.log("Usando modo local (demo)", e);
        }

        // ========== VARIABLES GLOBALES ==========
        let currentRoom = "GUARD1"; // Sala por defecto
        let role = null;
        let myPlayerIndex = -1;
        let players = [];
        let enemies = [];
        let powerups = [];
        let bullets = [];
        let roomRef = null;
        let gameActive = true;

        const MAX_PLAYERS = 4;
        const PLAYER_RADIUS = 20;
        const ENEMY_RADIUS = 18;
        const CANVAS_SIZE = 800;
        const playerColors = ['#00ffff', '#ffaa00', '#ff44ee', '#00ffaa'];
        const playerStartPos = [
            {x: 200, y: 200}, {x: 600, y: 200}, {x: 200, y: 600}, {x: 600, y: 600}
        ];

        // ========== GESTIÓN DE SALA ==========
        window.createRoom = function() {
            // Generar código aleatorio
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('roomCodeInput').value = code;
            joinRoom();
        };

        window.joinRoom = function() {
            const roomCode = document.getElementById('roomCodeInput').value.toUpperCase().trim();
            if (roomCode.length < 3) {
                alert("Ingresa un código válido (mínimo 3 caracteres)");
                return;
            }
            
            currentRoom = roomCode;
            document.getElementById('displayRoomCode').innerText = currentRoom;
            document.getElementById('gamepadRoomCode').innerText = currentRoom;
            
            // Ocultar pantalla de sala y mostrar selección de rol
            document.getElementById('roomScreen').style.display = 'none';
            document.getElementById('roleScreen').style.display = 'flex';
            
            // Inicializar Firebase para esta sala
            if (database) {
                roomRef = database.ref('rooms/' + currentRoom);
                
                // Escuchar cambios en la sala
                roomRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.players) {
                            updatePlayerCount(data.players);
                        }
                        if (role === 'controller' && myPlayerIndex >= 0 && data.players) {
                            const myPlayer = data.players[myPlayerIndex];
                            if (myPlayer) {
                                updateGamepadUI(myPlayer);
                            }
                        }
                    }
                });
            }
        };

        function updatePlayerCount(playersData) {
            let count = 0;
            if (playersData) {
                for (let i = 0; i < MAX_PLAYERS; i++) {
                    if (playersData[i] && playersData[i].connected) count++;
                }
            }
            document.getElementById('playerCount').innerText = `Jugadores: ${count}/4`;
        }

        // ========== SELECCIÓN DE ROL ==========
        window.selectRole = function(selectedRole) {
            role = selectedRole;
            document.getElementById('roleScreen').style.display = 'none';
            
            if (role === 'arena') {
                document.getElementById('arenaView').style.display = 'flex';
                initPlayers();
                setupArena();
            } else {
                document.getElementById('gamepadView').style.display = 'flex';
                setupController();
                
                // Solicitar conexión
                setTimeout(() => {
                    requestConnection();
                }, 1000);
            }
        };

        // ========== INICIALIZAR JUGADORES ==========
        function initPlayers() {
            for (let i = 0; i < MAX_PLAYERS; i++) {
                players.push({
                    index: i,
                    x: playerStartPos[i].x,
                    y: playerStartPos[i].y,
                    radius: PLAYER_RADIUS,
                    color: playerColors[i],
                    hp: 100,
                    maxHp: 100,
                    angle: 0,
                    shootCooldown: 0,
                    speed: 4,
                    powerUp: null,
                    shield: false,
                    active: true,
                    connected: false,
                    moveX: 0,
                    moveY: 0,
                    shooting: false,
                    special: false
                });
            }
            
            // Guardar en Firebase
            if (roomRef) {
                roomRef.set({
                    players: players,
                    gameState: 'active'
                });
            }
        }

        // ========== CLASES ==========
        class Enemy {
            constructor() {
                this.radius = ENEMY_RADIUS;
                this.x = Math.random() * CANVAS_SIZE;
                this.y = Math.random() * CANVAS_SIZE;
                this.hp = 40;
                this.speed = 1.8;
                this.color = '#ff2266';
                this.damage = 15;
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.radius = 15;
                this.color = type === 'rapid' ? '#ffff00' : '#00ccff';
                this.duration = 450;
            }
        }

        // ========== SOLICITAR CONEXIÓN ==========
        function requestConnection() {
            if (!roomRef) return;
            
            roomRef.child('players').once('value', (snapshot) => {
                const playersData = snapshot.val() || [];
                for (let i = 0; i < MAX_PLAYERS; i++) {
                    if (!playersData[i] || !playersData[i].connected) {
                        // Asignar este jugador
                        myPlayerIndex = i;
                        
                        // Actualizar en Firebase
                        roomRef.child('players').child(i).update({
                            connected: true,
                            color: playerColors[i],
                            hp: 100,
                            maxHp: 100
                        });
                        
                        // Mostrar controles
                        document.getElementById('waitingMessage').style.display = 'none';
                        document.getElementById('controlsContainer').style.display = 'block';
                        document.getElementById('connectionStatus').innerHTML = '✅ CONECTADO';
                        document.getElementById('playerIdText').innerText = `JUGADOR ${i + 1}`;
                        document.getElementById('playerColor').style.background = playerColors[i];
                        break;
                    }
                }
            });
        }

        // ========== ARENA ==========
        function setupArena() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // Generar enemigos
            setInterval(() => {
                if (enemies.length < 8) {
                    enemies.push(new Enemy());
                }
            }, 2000);

            setInterval(() => {
                if (powerups.length < 3) {
                    const type = Math.random() > 0.5 ? 'rapid' : 'shield';
                    powerups.push(new PowerUp(
                        Math.random() * 700 + 50,
                        Math.random() * 700 + 50,
                        type
                    ));
                }
            }, 8000);

            // Escuchar inputs de Firebase
            if (roomRef) {
                roomRef.child('players').on('value', (snapshot) => {
                    const playersData = snapshot.val();
                    if (playersData) {
                        for (let i = 0; i < MAX_PLAYERS; i++) {
                            if (playersData[i] && players[i]) {
                                players[i].moveX = playersData[i].moveX || 0;
                                players[i].moveY = playersData[i].moveY || 0;
                                players[i].shooting = playersData[i].shooting || false;
                                players[i].special = playersData[i].special || false;
                                players[i].connected = playersData[i].connected || false;
                            }
                        }
                    }
                });
            }

            function gameLoop() {
                if (!gameActive) return;
                updateGame();
                drawGame(ctx);
                
                // Guardar estado en Firebase
                if (roomRef) {
                    roomRef.child('players').update({
                        0: { hp: players[0].hp, connected: players[0].connected },
                        1: { hp: players[1].hp, connected: players[1].connected },
                        2: { hp: players[2].hp, connected: players[2].connected },
                        3: { hp: players[3].hp, connected: players[3].connected }
                    });
                }
                
                requestAnimationFrame(gameLoop);
            }

            function updateGame() {
                for (let p of players) {
                    if (!p.active) continue;

                    // Movimiento
                    p.x += (p.moveX || 0) * p.speed;
                    p.y += (p.moveY || 0) * p.speed;
                    
                    p.x = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.x));
                    p.y = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.y));

                    // Apuntar al enemigo más cercano
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    for (let e of enemies) {
                        const dist = Math.hypot(e.x - p.x, e.y - p.y);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = e;
                        }
                    }
                    
                    if (closestEnemy) {
                        p.angle = Math.atan2(closestEnemy.y - p.y, closestEnemy.x - p.x);
                    }

                    // Disparo
                    if (p.shootCooldown <= 0) {
                        if (p.shooting && closestEnemy) {
                            bullets.push({
                                x: p.x, y: p.y,
                                vx: Math.cos(p.angle) * 8,
                                vy: Math.sin(p.angle) * 8,
                                owner: p.index,
                                radius: 5
                            });
                            p.shootCooldown = (p.powerUp?.type === 'rapid') ? 4 : 12;
                        }
                    } else {
                        p.shootCooldown--;
                    }

                    p.shield = (p.special && p.powerUp?.type === 'shield');
                }

                // Balas
                for (let i = bullets.length-1; i>=0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x < 0 || b.x > CANVAS_SIZE || b.y < 0 || b.y > CANVAS_SIZE) {
                        bullets.splice(i,1);
                        continue;
                    }
                    for (let j=enemies.length-1; j>=0; j--) {
                        let e = enemies[j];
                        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
                            e.hp -= 25;
                            bullets.splice(i,1);
                            if (e.hp <= 0) {
                                enemies.splice(j,1);
                            }
                            break;
                        }
                    }
                }

                // Enemigos
                for (let e of enemies) {
                    let target = null;
                    let minDist = Infinity;
                    for (let p of players) {
                        if (!p.active) continue;
                        const d = Math.hypot(p.x - e.x, p.y - e.y);
                        if (d < minDist) {
                            minDist = d;
                            target = p;
                        }
                    }
                    if (target) {
                        const dx = target.x - e.x;
                        const dy = target.y - e.y;
                        if (minDist > 5) {
                            e.x += (dx / minDist) * e.speed;
                            e.y += (dy / minDist) * e.speed;
                        }
                        if (minDist < e.radius + target.radius) {
                            if (!target.shield) {
                                target.hp = Math.max(0, target.hp - e.damage);
                            }
                        }
                    }
                }

                // Power-ups
                for (let i=powerups.length-1; i>=0; i--) {
                    let pu = powerups[i];
                    for (let p of players) {
                        if (!p.active) continue;
                        if (Math.hypot(pu.x - p.x, pu.y - p.y) < pu.radius + p.radius) {
                            p.powerUp = {type: pu.type, timeLeft: pu.duration};
                            powerups.splice(i,1);
                            break;
                        }
                    }
                }

                for (let p of players) {
                    if (p.powerUp) {
                        p.powerUp.timeLeft--;
                        if (p.powerUp.timeLeft <= 0) {
                            p.powerUp = null;
                            p.shield = false;
                        }
                    }
                }
            }

            function drawGame(ctx) {
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Fondo
                ctx.fillStyle = '#110a1f';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Grid
                for (let i=0; i<CANVAS_SIZE; i+=40) {
                    ctx.strokeStyle = '#00ff9966';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(i,0); ctx.lineTo(i, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0,i); ctx.lineTo(CANVAS_SIZE, i);
                    ctx.stroke();
                }

                // Powerups
                for (let pu of powerups) {
                    ctx.beginPath();
                    ctx.arc(pu.x, pu.y, pu.radius, 0, 2*Math.PI);
                    ctx.fillStyle = pu.color;
                    ctx.shadowColor = pu.color;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = "bold 20px 'Courier New'";
                    ctx.fillStyle = 'white';
                    ctx.fillText(pu.type==='rapid'?'⚡':'🛡️', pu.x-15, pu.y+8);
                }

                // Enemigos
                for (let e of enemies) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, 2*Math.PI);
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'black';
                    ctx.font = "20px 'Courier New'";
                    ctx.fillText('💲', e.x-12, e.y+8);
                }

                // Jugadores
                for (let p of players) {
                    if (!p.active) continue;
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    
                    if (p.shield) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius+10, 0, 2*Math.PI);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                    
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.font = "22px 'Courier New'";
                    ctx.fillText('🛡️', p.x-14, p.y+10);
                    
                    if (p.connected) {
                        ctx.fillStyle = '#00ff00';
                        ctx.beginPath();
                        ctx.arc(p.x-25, p.y-25, 8, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }

                // Balas
                for (let b of bullets) {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffff00';
                    ctx.fillRect(b.x-3, b.y-3, 6, 6);
                }
                ctx.shadowBlur = 0;
            }

            gameLoop();
        }

        // ========== CONTROLADOR ==========
        function setupController() {
            const joystickBase = document.getElementById('joystickBase');
            const joystickThumb = document.getElementById('joystickThumb');
            
            if (joystickBase) {
                let joystickActive = false;
                let currentMoveX = 0;
                let currentMoveY = 0;
                
                joystickBase.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                });

                joystickBase.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!joystickActive) return;
                    
                    const touch = e.touches[0];
                    const rect = joystickBase.getBoundingClientRect();
                    const centerX = rect.left + rect.width/2;
                    const centerY = rect.top + rect.height/2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const maxDist = rect.width/2;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    
                    currentMoveX = dx / maxDist;
                    currentMoveY = dy / maxDist;
                    
                    sendInput();
                });

                joystickBase.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    joystickActive = false;
                    joystickThumb.style.transform = `translate(0px, 0px)`;
                    currentMoveX = 0;
                    currentMoveY = 0;
                    sendInput();
                });
            }

            let shooting = false;
            let special = false;
            
            document.getElementById('actionShoot').addEventListener('touchstart', (e) => {
                e.preventDefault();
                shooting = true;
                sendInput();
            });
            
            document.getElementById('actionShoot').addEventListener('touchend', (e) => {
                e.preventDefault();
                shooting = false;
                sendInput();
            });
            
            document.getElementById('actionSpecial').addEventListener('touchstart', (e) => {
                e.preventDefault();
                special = true;
                sendInput();
            });
            
            document.getElementById('actionSpecial').addEventListener('touchend', (e) => {
                e.preventDefault();
                special = false;
                sendInput();
            });
            
            function sendInput() {
                if (myPlayerIndex >= 0 && roomRef) {
                    roomRef.child('players').child(myPlayerIndex).update({
                        moveX: currentMoveX || 0,
                        moveY: currentMoveY || 0,
                        shooting: shooting,
                        special: special
                    });
                }
            }

            // Escuchar cambios en la vida
            if (roomRef) {
                roomRef.child('players').on('value', (snapshot) => {
                    const playersData = snapshot.val();
                    if (playersData && playersData[myPlayerIndex]) {
                        updateGamepadUI(playersData[myPlayerIndex]);
                    }
                });
            }
        }

        function updateGamepadUI(player) {
            const healthDots = document.querySelectorAll('.health-dot');
            const healthPercent = (player.hp || 100) / 100;
            const activeDots = Math.ceil(healthPercent * 5);
            
            healthDots.forEach((dot, index) => {
                if (index < activeDots) {
                    dot.style.background = '#00ffaa';
                    dot.style.boxShadow = '0 0 10px #00ffaa';
                } else {
                    dot.style.background = '#333';
                    dot.style.boxShadow = 'none';
                }
            });
        }

        // Código por defecto
        document.getElementById('roomCodeInput').value = 'GUARD1';
    </script>
</body>
