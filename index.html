<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Revolución Colectiva - LABERINTO ADAPTATIVO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0c2461;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        @keyframes globalGlitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-2px, 1px); filter: hue-rotate(45deg); }
            40% { transform: translate(2px, -1px); filter: hue-rotate(90deg); }
            60% { transform: translate(-1px, -1px); filter: hue-rotate(180deg); }
            80% { transform: translate(1px, 2px); filter: hue-rotate(270deg); }
            100% { transform: translate(0); filter: hue-rotate(360deg); }
        }

        .glitch-effect {
            animation: globalGlitch 0.3s ease;
        }

        .game-wrapper {
            max-width: min(800px, 95vw);
            width: 100%;
            background: #1e3799;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(246, 185, 59, 0.5);
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #162447;
            border: 3px solid #f6b93b;
            border-radius: 5px;
            cursor: default;
            position: relative;
            z-index: 2;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: white;
            font-size: clamp(12px, 3vw, 14px);
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #f6b93b;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }

        .controls-info {
            margin-top: 10px;
            color: #f6b93b;
            font-size: clamp(10px, 2.5vw, 12px);
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #f6b93b;
            position: relative;
            z-index: 2;
        }

        .touch-controls {
            display: none;
            margin-top: 10px;
            gap: 10px;
            position: relative;
            z-index: 10;
        }

        .touch-btn {
            flex: 1;
            padding: 15px;
            font-size: clamp(14px, 4vw, 16px);
            background: #e55039;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            border-bottom: 4px solid #b33939;
            transition: all 0.05s;
            touch-action: manipulation;
        }

        .touch-btn:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }

        /* JOYSTICK RESPONSIVE */
        .touch-joystick-area {
            display: none;
            position: relative;
            width: min(140px, 30vw);
            height: min(140px, 30vw);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            margin: 10px auto;
            border: 2px solid rgba(246, 185, 59, 0.8);
            box-shadow: 0 0 20px rgba(246, 185, 59, 0.4);
            backdrop-filter: blur(4px);
            touch-action: none;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .joystick-handle {
            width: min(60px, 13vw);
            height: min(60px, 13vw);
            background: radial-gradient(circle at 30% 30%, #6a89cc, #4a69bd);
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(74, 105, 189, 0.8), 0 4px 0 #1e3799;
            border: 2px solid #f6b93b;
            transition: none;
            will-change: transform, left, top;
            touch-action: none;
            pointer-events: none;
            margin-left: 0;
            margin-top: 0;
        }

        .joystick-handle.active {
            background: radial-gradient(circle at 30% 30%, #f6b93b, #e55039);
        }

        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: screen;
            opacity: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 0, 0, 0.2) 0px,
                rgba(0, 255, 0, 0.2) 2px,
                rgba(0, 0, 255, 0.2) 4px,
                transparent 6px
            );
            animation: scanlines 0.2s infinite linear;
        }

        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 10px; }
        }

        .glitch-overlay.active {
            opacity: 0.7;
        }

        .screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: clamp(20px, 5vw, 30px);
            border-radius: 10px;
            text-align: center;
            color: white;
            z-index: 200;
            border: 3px solid #f6b93b;
            max-width: 90%;
            backdrop-filter: blur(5px);
        }

        .screen.hidden {
            display: none;
        }

        .screen h1 {
            font-size: clamp(20px, 6vw, 28px);
        }

        .btn {
            background: #e55039;
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 15px) clamp(24px, 6vw, 30px);
            margin: 10px;
            border-radius: 5px;
            font-size: clamp(14px, 4vw, 16px);
            cursor: pointer;
            border-bottom: 4px solid #b33939;
            transition: all 0.05s;
            font-weight: bold;
        }

        .btn:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }

        @media (max-width: 768px) {
            .keyboard-only {
                display: none;
            }
            .touch-controls {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .touch-joystick-area {
                display: block;
            }
            .touch-btn {
                width: 100%;
                padding: 18px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div class="glitch-overlay" id="glitchOverlay"></div>
        
        <div class="hud">
            <div>👥 SEGUIDORES: <span id="followerCount">0</span> / <span id="requiredFollowers">5</span></div>
            <div>⚡ POWER: <span id="powerUpStatus">-</span></div>
            <div>🗺️ LABERINTO: <span id="mazeSizeDisplay">8x8</span></div>
        </div>

        <!-- CONTROLES TÁCTILES -->
        <div class="touch-controls">
            <div class="touch-joystick-area" id="joystickArea">
                <div class="joystick-base">
                    <div class="joystick-handle" id="joystickHandle"></div>
                </div>
            </div>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button class="touch-btn" id="recruitBtn">🔥 RECLUTAR</button>
                <button class="touch-btn" id="screenshotBtn">📸 POWER-UP</button>
            </div>
        </div>

        <div class="controls-info keyboard-only">
            <p>🎮 WASD / FLECHAS = MOVER | ESPACIO = RECLUTAR | C = POWER-UP</p>
            <p style="color: #78e08f; margin-top: 5px;">¡EL PUEBLO UNIDO JAMÁS SERÁ VENCIDO!</p>
        </div>

        <div id="startScreen" class="screen">
            <h1 style="color: #f6b93b; text-shadow: 3px 3px 0 #e55039;">REVOLUCIÓN</h1>
            <h1 style="color: #f6b93b; margin-top: -10px; text-shadow: 3px 3px 0 #e55039;">COLECTIVA</h1>
            <p style="margin: 20px 0; line-height: 1.6;">✊ Recluta seguidores ✊<br>💪 Derrota al sistema opresor 💪</p>
            <button class="btn" id="startBtn">COMENZAR REVOLUCIÓN</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #e55039;">✖ DERROTADO ✖</h1>
            <p id="gameOverText" style="margin: 20px 0; line-height: 1.6;"></p>
            <button class="btn" id="restartBtn">REINTENTAR</button>
        </div>

        <div id="winScreen" class="screen hidden">
            <h1 style="color: #78e08f;">¡VICTORIA DEL PUEBLO!</h1>
            <p id="winText" style="margin: 20px 0; line-height: 1.6;"></p>
            <button class="btn" id="playAgainBtn">NUEVA REVOLUCIÓN</button>
        </div>
    </div>

    <script>
        // ========== CONFIGURACIÓN INICIAL ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const isTouchDevice = 'ontouchstart' in window;

        const followerSpan = document.getElementById('followerCount');
        const requiredSpan = document.getElementById('requiredFollowers');
        const powerUpSpan = document.getElementById('powerUpStatus');
        const mazeSizeDisplay = document.getElementById('mazeSizeDisplay');
        const glitchOverlay = document.getElementById('glitchOverlay');

        // ========== SISTEMA DE GLITCH ==========
        function triggerGlitch(intensity = 1, duration = 500) {
            glitchOverlay.classList.add('active');
            glitchOverlay.style.opacity = intensity * 0.7;
            document.querySelector('.game-wrapper').classList.add('glitch-effect');
            
            setTimeout(() => {
                glitchOverlay.classList.remove('active');
                document.querySelector('.game-wrapper').classList.remove('glitch-effect');
            }, duration);
        }

        function triggerVictoryGlitch() {
            triggerGlitch(1, 800);
            setTimeout(() => triggerGlitch(0.8, 300), 200);
            setTimeout(() => triggerGlitch(0.6, 200), 500);
        }

        function triggerDefeatGlitch() {
            triggerGlitch(1, 600);
            setTimeout(() => triggerGlitch(0.9, 200), 150);
            setTimeout(() => triggerGlitch(0.7, 200), 350);
            setTimeout(() => triggerGlitch(0.5, 200), 550);
        }

        // ========== VARIABLES DEL JUEGO ==========
        let gameRunning = false;
        
        // Jugador
        let player = {
            x: 0,
            y: 0,
            size: 16,
            speed: 3.8,
            color: '#4a69bd'
        };

        let followers = [];
        let citizens = [];
        let enemies = [];
        let boss = null;

        // LABERINTO ADAPTATIVO - variables dinámicas
        let maze = [];
        let mazeSize = 8; // valor inicial, se recalcula
        let tileSize = 60; // valor inicial, se recalcula
        let mazeGenerated = false;

        let bossRequiredFollowers = 5;
        let powerUpActive = false;
        let powerUpTimer = 0;
        let powerUpType = '';

        // CONTROLES PC
        let keys = {
            w: false, a: false, s: false, d: false,
            arrowup: false, arrowdown: false, arrowleft: false, arrowright: false,
            space: false
        };

        // JOYSTICK
        let joystick = {
            active: false,
            x: 0,
            y: 0,
            rawX: 0,
            rawY: 0
        };

        // ========== GENERADOR DE LABERINTO ADAPTATIVO ==========
        function generateAdaptiveMaze() {
            // Calcular tamaño óptimo basado en el ancho del canvas
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;
            
            // Tamaño de celda ideal - entre 40px y 70px según pantalla
            tileSize = Math.floor(Math.min(
                Math.max(canvasWidth / 12, 40),
                Math.min(canvasHeight / 12, 70)
            ));
            
            // Calcular número de celdas que caben en el canvas
            let maxCols = Math.floor(canvasWidth / tileSize) - 1;
            let maxRows = Math.floor(canvasHeight / tileSize) - 1;
            
            // Limitar a un rango jugable (mínimo 6, máximo 14)
            mazeSize = Math.min(Math.max(maxCols, maxRows, 6), 14);
            
            // Asegurar que sea impar para mejor generación de laberintos
            if (mazeSize % 2 === 0) mazeSize++;
            
            // Actualizar display
            mazeSizeDisplay.textContent = `${mazeSize}x${mazeSize}`;
            
            // Inicializar laberinto vacío (todo paredes)
            maze = Array(mazeSize).fill().map(() => Array(mazeSize).fill(1));
            
            // === ALGORITMO DE BACKTRACKING PARA LABERINTO PERFECTO ===
            const stack = [];
            
            // Empezar en una celda impar (1,1)
            const startX = 1;
            const startY = 1;
            
            maze[startY][startX] = 0;
            stack.push([startX, startY]);
            
            const dirs = [[0, -2], [2, 0], [0, 2], [-2, 0]];
            
            while (stack.length > 0) {
                const [x, y] = stack[stack.length - 1];
                
                // Mezclar direcciones
                const shuffled = [...dirs].sort(() => Math.random() - 0.5);
                let moved = false;
                
                for (const [dx, dy] of shuffled) {
                    const nx = x + dx;
                    const ny = y + dy;
                    
                    if (nx > 0 && nx < mazeSize - 1 && 
                        ny > 0 && ny < mazeSize - 1 && 
                        maze[ny][nx] === 1) {
                        
                        // Abrir camino
                        maze[y + dy/2][x + dx/2] = 0;
                        maze[ny][nx] = 0;
                        stack.push([nx, ny]);
                        moved = true;
                        break;
                    }
                }
                
                if (!moved) {
                    stack.pop();
                }
            }
            
            // === CREAR ENTRADA Y SALIDA ===
            
            // Entrada (esquina superior izquierda)
            maze[1][0] = 0; // Entrada en el borde
            
            // Salida (esquina inferior derecha)
            maze[mazeSize-2][mazeSize-1] = 0;
            
            // Asegurar bordes
            for (let i = 0; i < mazeSize; i++) {
                maze[0][i] = 1;
                maze[mazeSize-1][i] = 1;
                maze[i][0] = 1;
                maze[i][mazeSize-1] = 1;
            }
            
            // Conectar entrada con el interior
            maze[1][1] = 0;
            
            // Conectar salida con el interior
            maze[mazeSize-2][mazeSize-2] = 0;
            
            // Posicionar jugador en la entrada
            player.x = tileSize + tileSize/2;
            player.y = tileSize + tileSize/2;
            
            // Ajustar tamaño del jugador según tileSize
            player.size = Math.max(12, Math.floor(tileSize * 0.3));
            
            mazeGenerated = true;
            
            console.log(`Laberinto generado: ${mazeSize}x${mazeSize}, tileSize: ${tileSize}px`);
        }

        // ========== REDIMENSIONAR CANVAS ==========
        function resizeCanvas() {
            const container = document.querySelector('.game-wrapper');
            const containerWidth = container.clientWidth;
            
            // Canvas cuadrado pero responsive
            canvas.width = Math.min(containerWidth, 800);
            canvas.height = canvas.width; // Mantener aspecto cuadrado
            
            // Si el juego está corriendo, regenerar laberinto
            if (gameRunning) {
                generateAdaptiveMaze();
                
                // Reposicionar elementos del juego
                repositionGameElements();
            }
        }

        function repositionGameElements() {
            if (!mazeGenerated) return;
            
            // Recolocar jugador en la entrada
            player.x = tileSize + tileSize/2;
            player.y = tileSize + tileSize/2;
            player.size = Math.max(12, Math.floor(tileSize * 0.3));
            
            // Limpiar y regenerar ciudadanos, enemigos y jefe
            citizens = [];
            enemies = [];
            
            // Ciudadanos
            const numCitizens = Math.floor(mazeSize * 1.5);
            for (let i = 0; i < numCitizens; i++) {
                let x, y, attempts = 0;
                do {
                    x = Math.floor(Math.random() * (mazeSize - 2)) + 1;
                    y = Math.floor(Math.random() * (mazeSize - 2)) + 1;
                    attempts++;
                    if (attempts > 100) break;
                } while (maze[y][x] !== 0 || (x === 1 && y === 1) || (x === mazeSize-2 && y === mazeSize-2));
                
                if (attempts <= 100) {
                    citizens.push({
                        x: x * tileSize + tileSize/2,
                        y: y * tileSize + tileSize/2,
                        size: Math.max(10, Math.floor(tileSize * 0.2)),
                        color: '#78e08f'
                    });
                }
            }

            // Enemigos
            const numEnemies = Math.floor(mazeSize * 0.6);
            for (let i = 0; i < numEnemies; i++) {
                let x, y, attempts = 0;
                do {
                    x = Math.floor(Math.random() * (mazeSize - 2)) + 1;
                    y = Math.floor(Math.random() * (mazeSize - 2)) + 1;
                    attempts++;
                    if (attempts > 100) break;
                } while (maze[y][x] !== 0 || Math.abs(x - 1) + Math.abs(y - 1) < 4);
                
                if (attempts <= 100) {
                    enemies.push({
                        x: x * tileSize + tileSize/2,
                        y: y * tileSize + tileSize/2,
                        size: Math.max(14, Math.floor(tileSize * 0.25)),
                        color: '#e55039',
                        speed: 1.0,
                        dx: (Math.random() - 0.5) * 2,
                        dy: (Math.random() - 0.5) * 2
                    });
                }
            }

            // Jefe (en la salida)
            const bossX = mazeSize - 2;
            const bossY = mazeSize - 2;
            
            bossRequiredFollowers = Math.min(8, Math.max(4, Math.floor(mazeSize / 2)));
            boss = {
                x: bossX * tileSize + tileSize/2,
                y: bossY * tileSize + tileSize/2,
                size: Math.max(32, Math.floor(tileSize * 0.7)),
                color: '#8e44ad',
                health: bossRequiredFollowers * 2,
                maxHealth: bossRequiredFollowers * 2
            };

            // Actualizar HUD
            followerSpan.textContent = followers.length;
            requiredSpan.textContent = bossRequiredFollowers;
        }

        // ========== SETUP JOYSTICK ==========
        function setupJoystick() {
            const joystickArea = document.getElementById('joystickArea');
            const joystickHandle = document.getElementById('joystickHandle');
            
            if (!joystickArea) return;

            // Resetear posición
            joystickHandle.style.left = '50%';
            joystickHandle.style.top = '50%';
            joystickHandle.style.transform = 'translate(-50%, -50%)';

            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystick.active = true;
                joystickHandle.classList.add('active');
                
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                updateJoystickPosition(touch.clientX, touch.clientY, centerX, centerY, joystickHandle);
            });

            document.addEventListener('touchmove', (e) => {
                if (!joystick.active) return;
                e.preventDefault();
                
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                updateJoystickPosition(touch.clientX, touch.clientY, centerX, centerY, joystickHandle);
            });

            document.addEventListener('touchend', (e) => {
                if (!joystick.active) return;
                e.preventDefault();
                
                joystick.active = false;
                joystick.x = 0;
                joystick.y = 0;
                joystickHandle.classList.remove('active');
                joystickHandle.style.left = '50%';
                joystickHandle.style.top = '50%';
                joystickHandle.style.transform = 'translate(-50%, -50%)';
            });

            document.addEventListener('touchcancel', (e) => {
                if (!joystick.active) return;
                e.preventDefault();
                
                joystick.active = false;
                joystick.x = 0;
                joystick.y = 0;
                joystickHandle.classList.remove('active');
                joystickHandle.style.left = '50%';
                joystickHandle.style.top = '50%';
                joystickHandle.style.transform = 'translate(-50%, -50%)';
            });
        }

        function updateJoystickPosition(touchX, touchY, centerX, centerY, handle) {
            let dx = touchX - centerX;
            let dy = touchY - centerY;
            
            const maxDistance = 40;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }
            
            joystick.x = dx / maxDistance;
            joystick.y = dy / maxDistance;
            
            // Usar transform para posicionamiento relativo al centro
            handle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }

        // ========== CONTROLES PC ==========
        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                
                if (key === 'w' || key === 'arrowup') { e.preventDefault(); keys.w = true; }
                if (key === 's' || key === 'arrowdown') { e.preventDefault(); keys.s = true; }
                if (key === 'a' || key === 'arrowleft') { e.preventDefault(); keys.a = true; }
                if (key === 'd' || key === 'arrowright') { e.preventDefault(); keys.d = true; }
                if (key === ' ') {
                    e.preventDefault();
                    recruitCitizens();
                }
                if (key === 'c') {
                    e.preventDefault();
                    activatePowerUp();
                }
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                
                if (key === 'w' || key === 'arrowup') keys.w = false;
                if (key === 's' || key === 'arrowdown') keys.s = false;
                if (key === 'a' || key === 'arrowleft') keys.a = false;
                if (key === 'd' || key === 'arrowright') keys.d = false;
            });
        }

        // ========== MECÁNICAS ==========
        function recruitCitizens() {
            if (!gameRunning) return;
            
            let recruited = 0;
            
            for (let i = citizens.length - 1; i >= 0; i--) {
                const citizen = citizens[i];
                const dist = Math.hypot(player.x - citizen.x, player.y - citizen.y);
                
                if (dist < tileSize * 0.8) {
                    followers.push({
                        x: citizen.x,
                        y: citizen.y,
                        size: player.size * 0.8,
                        color: '#f6b93b'
                    });
                    citizens.splice(i, 1);
                    recruited++;
                }
            }
            
            if (recruited > 0) {
                triggerGlitch(0.4, 200);
                followerSpan.textContent = followers.length;
            }
        }

        function activatePowerUp() {
            if (!gameRunning) return;
            
            powerUpActive = true;
            powerUpTimer = 240;
            
            const types = ['speed', 'protection', 'recruit'];
            powerUpType = types[Math.floor(Math.random() * 3)];
            
            powerUpSpan.textContent = powerUpType === 'speed' ? '⚡ VELOCIDAD' : 
                                     powerUpType === 'protection' ? '🛡️ PROTECCIÓN' : 
                                     '📢 RECLUTAMIENTO';
            
            triggerGlitch(0.5, 300);
            
            if (powerUpType === 'speed') {
                player.speed = 5.5;
            } else if (powerUpType === 'recruit') {
                for (let i = citizens.length - 1; i >= 0; i--) {
                    const citizen = citizens[i];
                    const dist = Math.hypot(player.x - citizen.x, player.y - citizen.y);
                    if (dist < tileSize * 1.5) {
                        followers.push({
                            x: citizen.x,
                            y: citizen.y,
                            size: player.size * 0.8,
                            color: '#f6b93b'
                        });
                        citizens.splice(i, 1);
                    }
                }
                followerSpan.textContent = followers.length;
            }
        }

        // ========== MOVIMIENTO FLUIDO ==========
        function movePlayer() {
            let moveX = 0, moveY = 0;
            
            if (keys.w || keys.arrowup) moveY -= 1;
            if (keys.s || keys.arrowdown) moveY += 1;
            if (keys.a || keys.arrowleft) moveX -= 1;
            if (keys.d || keys.arrowright) moveX += 1;
            
            if (joystick.active) {
                moveX += joystick.x;
                moveY += joystick.y;
            }
            
            if (moveX !== 0 || moveY !== 0) {
                const length = Math.sqrt(moveX * moveX + moveY * moveY);
                moveX = (moveX / length) * player.speed;
                moveY = (moveY / length) * player.speed;
                
                // Movimiento en X
                let newX = player.x + moveX;
                let tileX = Math.floor(newX / tileSize);
                let tileY = Math.floor(player.y / tileSize);
                
                if (tileX >= 0 && tileX < mazeSize && tileY >= 0 && tileY < mazeSize) {
                    if (maze[tileY][tileX] === 0) {
                        player.x = newX;
                    }
                }
                
                // Movimiento en Y
                let newY = player.y + moveY;
                tileX = Math.floor(player.x / tileSize);
                tileY = Math.floor(newY / tileSize);
                
                if (tileX >= 0 && tileX < mazeSize && tileY >= 0 && tileY < mazeSize) {
                    if (maze[tileY][tileX] === 0) {
                        player.y = newY;
                    }
                }
            }
            
            // Límites del canvas
            player.x = Math.max(tileSize/2, Math.min(player.x, canvas.width - tileSize/2));
            player.y = Math.max(tileSize/2, Math.min(player.y, canvas.height - tileSize/2));
        }

        function update() {
            if (!gameRunning) return;

            movePlayer();

            // Actualizar seguidores
            for (let i = 0; i < followers.length; i++) {
                const follower = followers[i];
                const target = i === 0 ? player : followers[i-1];
                
                const dx = target.x - follower.x;
                const dy = target.y - follower.y;
                const dist = Math.hypot(dx, dy);
                
                if (dist > 25) {
                    follower.x += (dx / dist) * player.speed * 0.6;
                    follower.y += (dy / dist) * player.speed * 0.6;
                }
            }

            // Actualizar enemigos
            for (let enemy of enemies) {
                if (Math.random() < 0.02) {
                    const angle = Math.random() * Math.PI * 2;
                    enemy.dx = Math.cos(angle) * enemy.speed;
                    enemy.dy = Math.sin(angle) * enemy.speed;
                }
                
                let newX = enemy.x + enemy.dx;
                let newY = enemy.y + enemy.dy;
                let tileX = Math.floor(newX / tileSize);
                let tileY = Math.floor(newY / tileSize);
                
                if (tileX >= 0 && tileX < mazeSize && tileY >= 0 && tileY < mazeSize && maze[tileY][tileX] === 0) {
                    enemy.x = newX;
                    enemy.y = newY;
                } else {
                    enemy.dx = -enemy.dx;
                    enemy.dy = -enemy.dy;
                }
                
                // Colisión con jugador
                if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.size/2 + enemy.size/2) {
                    if (followers.length > 0) {
                        followers.pop();
                        followerSpan.textContent = followers.length;
                    } else {
                        gameOver();
                    }
                }
                
                // Colisión con seguidores
                for (let i = followers.length - 1; i >= 0; i--) {
                    const follower = followers[i];
                    if (Math.hypot(follower.x - enemy.x, follower.y - enemy.y) < follower.size/2 + enemy.size/2) {
                        followers.splice(i, 1);
                        followerSpan.textContent = followers.length;
                        break;
                    }
                }
            }

            // Combate con jefe
            if (boss) {
                const distToBoss = Math.hypot(player.x - boss.x, player.y - boss.y);
                
                if (distToBoss < tileSize * 1.2) {
                    if (followers.length >= bossRequiredFollowers) {
                        boss.health -= 0.8;
                        if (Math.random() < 0.1) triggerGlitch(0.2, 50);
                        if (boss.health <= 0) victory();
                    }
                }
            }

            // Power-up timer
            if (powerUpActive) {
                powerUpTimer--;
                if (powerUpTimer <= 0) {
                    powerUpActive = false;
                    powerUpSpan.textContent = '-';
                    if (powerUpType === 'speed') {
                        player.speed = 3.8;
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar laberinto
            for (let y = 0; y < mazeSize; y++) {
                for (let x = 0; x < mazeSize; x++) {
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = '#0f3460';
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize - 1, tileSize - 1);
                        ctx.strokeStyle = '#162447';
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize - 1, tileSize - 1);
                    }
                }
            }

            // Dibujar entrada (verde suave)
            ctx.fillStyle = 'rgba(120, 224, 143, 0.2)';
            ctx.fillRect(1 * tileSize, 1 * tileSize, tileSize - 1, tileSize - 1);
            
            // Dibujar salida (púrpura suave)
            ctx.fillStyle = 'rgba(142, 68, 173, 0.2)';
            ctx.fillRect((mazeSize-2) * tileSize, (mazeSize-2) * tileSize, tileSize - 1, tileSize - 1);

            // Ciudadanos
            for (let citizen of citizens) {
                ctx.fillStyle = citizen.color;
                ctx.beginPath();
                ctx.arc(citizen.x, citizen.y, citizen.size/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(citizen.x - 3, citizen.y - 3, 2, 0, Math.PI * 2);
                ctx.arc(citizen.x + 3, citizen.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Enemigos
            for (let enemy of enemies) {
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(enemy.x - 4, enemy.y - 4, 3, 0, Math.PI * 2);
                ctx.arc(enemy.x + 4, enemy.y - 4, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(enemy.x - 5, enemy.y - 5, 1.5, 0, Math.PI * 2);
                ctx.arc(enemy.x + 3, enemy.y - 5, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Seguidores
            for (let follower of followers) {
                ctx.fillStyle = follower.color;
                ctx.beginPath();
                ctx.arc(follower.x, follower.y, follower.size/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e55039';
                ctx.fillRect(follower.x + 4, follower.y - 8, 5, 10);
                ctx.fillStyle = '#f6b93b';
                ctx.beginPath();
                ctx.moveTo(follower.x + 9, follower.y - 8);
                ctx.lineTo(follower.x + 9, follower.y + 2);
                ctx.lineTo(follower.x + 13, follower.y - 3);
                ctx.closePath();
                ctx.fill();
            }

            // Jefe
            if (boss) {
                ctx.fillStyle = boss.color;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.size/2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#f6b93b';
                ctx.beginPath();
                ctx.moveTo(boss.x - 15, boss.y - 15);
                ctx.lineTo(boss.x - 8, boss.y - 25);
                ctx.lineTo(boss.x, boss.y - 15);
                ctx.lineTo(boss.x + 8, boss.y - 25);
                ctx.lineTo(boss.x + 15, boss.y - 15);
                ctx.fill();
                
                ctx.fillStyle = '#333';
                ctx.fillRect(boss.x - 40, boss.y - 40, 80, 8);
                ctx.fillStyle = '#e55039';
                ctx.fillRect(boss.x - 40, boss.y - 40, 80 * (boss.health / boss.maxHealth), 8);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(boss.x - 40, boss.y - 40, 80, 8);
            }

            // Jugador
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x - 3, player.y - 3, 2.5, 0, Math.PI * 2);
            ctx.arc(player.x + 3, player.y - 3, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0c2461';
            ctx.beginPath();
            ctx.arc(player.x - 4, player.y - 4, 1.5, 0, Math.PI * 2);
            ctx.arc(player.x + 2, player.y - 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#e55039';
            ctx.fillRect(player.x + 6, player.y - 10, 6, 14);
            ctx.fillStyle = '#f6b93b';
            ctx.beginPath();
            ctx.moveTo(player.x + 12, player.y - 10);
            ctx.lineTo(player.x + 12, player.y + 4);
            ctx.lineTo(player.x + 18, player.y - 3);
            ctx.closePath();
            ctx.fill();
            
            if (powerUpActive) {
                ctx.strokeStyle = powerUpType === 'speed' ? '#78e08f' : 
                                 powerUpType === 'protection' ? '#4a69bd' : '#f6b93b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size/2 + 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.font = `bold ${Math.max(10, tileSize/6)}px "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.ceil(powerUpTimer / 60)}s`, player.x, player.y + player.size + 15);
            }
        }

        function gameOver() {
            gameRunning = false;
            triggerDefeatGlitch();
            document.getElementById('gameOverText').innerHTML = 
                `✖ REVOLUCIÓN FRACASADA ✖<br><br>` +
                `Reuniste ${followers.length} de ${bossRequiredFollowers} seguidores.`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function victory() {
            gameRunning = false;
            triggerVictoryGlitch();
            document.getElementById('winText').innerHTML = 
                `✨ ¡EL PUEBLO VENCIÓ! ✨<br><br>` +
                `Derrotaste al opresor con ${followers.length} seguidores.`;
            document.getElementById('winScreen').classList.remove('hidden');
        }

        function initGame() {
            followers = [];
            powerUpActive = false;
            powerUpTimer = 0;
            powerUpSpan.textContent = '-';
            
            generateAdaptiveMaze();
            repositionGameElements();
            
            gameRunning = true;
        }

        // ========== INICIALIZACIÓN ==========
        function initialize() {
            setupKeyboardControls();
            setupJoystick();
            
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            
            document.getElementById('startBtn').addEventListener('click', () => {
                document.getElementById('startScreen').classList.add('hidden');
                resizeCanvas();
                initGame();
            });
            
            document.getElementById('restartBtn').addEventListener('click', () => {
                document.getElementById('gameOverScreen').classList.add('hidden');
                resizeCanvas();
                initGame();
            });
            
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                document.getElementById('winScreen').classList.add('hidden');
                resizeCanvas();
                initGame();
            });
            
            document.getElementById('recruitBtn').addEventListener('click', recruitCitizens);
            document.getElementById('recruitBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                recruitCitizens();
            });
            
            document.getElementById('screenshotBtn').addEventListener('click', activatePowerUp);
            document.getElementById('screenshotBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                activatePowerUp();
            });
            
            // Generar vista previa del laberinto en la pantalla de inicio
            resizeCanvas();
        }

        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        initialize();
        gameLoop();
    </script>
</body>
</html>
