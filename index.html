<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUARDIANES · SALA FIJA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c0f;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        /* Pantalla de sala */
        .room-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0b1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            text-align: center;
        }

        .room-title {
            font-size: 2rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 30px;
        }

        .room-input {
            background: #2a1e3a;
            border: 3px solid #ff00c6;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 2rem;
            color: white;
            text-align: center;
            width: 300px;
            margin: 20px;
            font-family: monospace;
            letter-spacing: 5px;
        }

        .room-btn {
            background: #6200ee;
            border: none;
            border-radius: 40px;
            padding: 20px 40px;
            font-size: 1.5rem;
            color: white;
            margin: 10px;
            cursor: pointer;
            border: 2px solid #bb86fc;
        }

        /* Pantalla de selección de rol */
        .role-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0b1a 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        .role-title {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 40px;
        }

        .role-buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-btn {
            padding: 30px 50px;
            border-radius: 40px;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 280px;
        }

        .arena-btn {
            background: #6200ee;
            color: white;
            border: 4px solid #bb86fc;
        }

        .controller-btn {
            background: #03dac6;
            color: black;
            border: 4px solid #00ffff;
        }

        .room-code-display {
            margin-top: 30px;
            color: #00ffff;
            font-size: 2rem;
            font-weight: bold;
        }

        /* VISTA ARENA */
        .presentation-mode {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        #gameCanvas {
            display: block;
            width: min(90vw, 90vh);
            aspect-ratio: 1/1;
            image-rendering: pixelated;
            background: #110f1a;
            border: 4px solid #00ffff;
            border-radius: 24px;
            box-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff;
        }

        /* VISTA GAMEPAD */
        .gamepad-mode {
            display: none;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #121212;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px 32px;
        }

        .gamepad-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .gamepad-title {
            color: #00ffff;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .player-chip {
            background: #2c2c2c;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-radius: 40px;
        }

        .chip-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00ffff;
        }

        .health-material {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .health-dot {
            width: 24px;
            height: 24px;
            border-radius: 12px;
            background: #333;
            transition: all 0.3s;
        }

        .joystick-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 240px;
        }

        .md-joystick {
            width: 200px;
            height: 200px;
            background: #1e1e1e;
            border-radius: 999px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            touch-action: none;
        }

        .md-joystick-thumb {
            width: 90px;
            height: 90px;
            background: #6200ee;
            border-radius: 999px;
            transition: transform 0.05s ease;
            touch-action: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 24px 0;
        }

        .md-button {
            background: #6200ee;
            border: none;
            border-radius: 56px;
            padding: 24px 0;
            color: white;
            font-size: 2rem;
            touch-action: manipulation;
        }

        .md-button.secondary {
            background: #03dac6;
            color: #000;
        }

        .connection-status {
            background: #1e1e1e;
            border-radius: 28px;
            padding: 16px;
            text-align: center;
            color: #bb86fc;
        }

        .waiting-message {
            color: white;
            font-size: 1.5rem;
            margin-top: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Pantalla de sala -->
    <div class="room-screen" id="roomScreen">
        <div class="room-title">GUARDIANES DEL TERRITORIO</div>
        <div class="room-title" style="font-size: 1.2rem;">CÓDIGO DE SALA</div>
        <input type="text" class="room-input" id="roomCodeInput" placeholder="ABC123" value="GUARD1" maxlength="6" style="text-transform: uppercase;">
        <div>
            <button class="room-btn" onclick="joinRoom()">UNIRSE A SALA</button>
            <button class="room-btn" onclick="createRoom()">CREAR SALA</button>
        </div>
    </div>

    <!-- Pantalla de selección de rol -->
    <div class="role-screen" id="roleScreen">
        <div class="role-title">SALA: <span id="displayRoomCode">GUARD1</span></div>
        <div class="role-buttons">
            <button class="role-btn arena-btn" onclick="selectRole('arena')">
                🖥️ SERVIDOR (ARENA)
            </button>
            <button class="role-btn controller-btn" onclick="selectRole('controller')">
                🎮 JUGADOR (CONTROL)
            </button>
        </div>
        <div class="room-code-display" id="playerCount">Jugadores: 0/4</div>
    </div>

    <!-- VISTA ARENA -->
    <div class="presentation-mode" id="arenaView">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </div>

    <!-- VISTA GAMEPAD -->
    <div class="gamepad-mode" id="gamepadView">
        <div class="gamepad-header">
            <div class="gamepad-title">SALA <span id="gamepadRoomCode"></span></div>
            <div class="player-chip" id="playerChip">
                <div class="chip-avatar" id="playerColor"></div>
                <span id="playerIdText">CONECTANDO...</span>
            </div>
        </div>

        <div class="health-material" id="healthBars">
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
        </div>

        <div class="waiting-message" id="waitingMessage">
            ESPERANDO ASIGNACIÓN...
        </div>

        <div id="controlsContainer" style="display: none;">
            <div class="joystick-container">
                <div class="md-joystick" id="joystickBase">
                    <div class="md-joystick-thumb" id="joystickThumb"></div>
                </div>
            </div>

            <div class="buttons-grid">
                <button class="md-button" id="actionShoot">🔫</button>
                <button class="md-button secondary" id="actionSpecial">🛡️</button>
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">
            ⚡ ESPERANDO CONEXIÓN...
        </div>
    </div>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let currentRoom = "GUARD1";
        let role = null;
        let myPlayerIndex = -1;
        let players = [];
        let enemies = [];
        let powerups = [];
        let bullets = [];
        let gameActive = true;
        
        // Usaremos localStorage para compartir estado entre dispositivos en la misma red
        // Esta es la clave: todos los dispositivos que usen el mismo código de sala
        // compartirán el mismo localStorage (si están en el mismo dominio)
        
        const MAX_PLAYERS = 4;
        const PLAYER_RADIUS = 20;
        const ENEMY_RADIUS = 18;
        const CANVAS_SIZE = 800;
        const playerColors = ['#00ffff', '#ffaa00', '#ff44ee', '#00ffaa'];
        const playerStartPos = [
            {x: 200, y: 200}, {x: 600, y: 200}, {x: 200, y: 600}, {x: 600, y: 600}
        ];

        // ========== GESTIÓN DE SALA ==========
        window.createRoom = function() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('roomCodeInput').value = code;
            joinRoom();
        };

        window.joinRoom = function() {
            const roomCode = document.getElementById('roomCodeInput').value.toUpperCase().trim();
            if (roomCode.length < 3) {
                alert("Ingresa un código válido");
                return;
            }
            
            currentRoom = roomCode;
            document.getElementById('displayRoomCode').innerText = currentRoom;
            document.getElementById('gamepadRoomCode').innerText = currentRoom;
            
            // Ocultar pantalla de sala y mostrar selección de rol
            document.getElementById('roomScreen').style.display = 'none';
            document.getElementById('roleScreen').style.display = 'flex';
            
            // Escuchar cambios en localStorage para esta sala
            setupStorageListener();
        };

        // ========== SISTEMA DE COMUNICACIÓN POR STORAGE ==========
        function setupStorageListener() {
            // Escuchar cambios en localStorage
            window.addEventListener('storage', (e) => {
                if (e.key === `game_${currentRoom}`) {
                    try {
                        const data = JSON.parse(e.newValue);
                        handleStorageData(data);
                    } catch (error) {
                        console.log("Error parsing storage data", error);
                    }
                }
            });

            // Si es arena, inicializar el estado
            if (role === 'arena') {
                initGameState();
            }
        }

        function handleStorageData(data) {
            if (role === 'arena') {
                // Recibir inputs de controladores
                if (data.type === 'controller_input' && players[data.playerIndex]) {
                    players[data.playerIndex].moveX = data.moveX;
                    players[data.playerIndex].moveY = data.moveY;
                    players[data.playerIndex].shooting = data.shooting;
                    players[data.playerIndex].special = data.special;
                }
                
                if (data.type === 'request_connection') {
                    assignPlayerToController(data.clientId);
                }
            } else {
                // Recibir estado del juego
                if (data.type === 'game_state' && myPlayerIndex >= 0) {
                    const myPlayer = data.players[myPlayerIndex];
                    if (myPlayer) {
                        updateGamepadUI(myPlayer);
                    }
                }
                
                if (data.type === 'connection_assigned' && data.clientId === getClientId()) {
                    myPlayerIndex = data.playerIndex;
                    document.getElementById('waitingMessage').style.display = 'none';
                    document.getElementById('controlsContainer').style.display = 'block';
                    document.getElementById('connectionStatus').innerHTML = '✅ CONECTADO';
                    document.getElementById('playerIdText').innerText = `JUGADOR ${myPlayerIndex + 1}`;
                    document.getElementById('playerColor').style.background = data.color;
                }
            }
        }

        // Identificador único para este dispositivo
        function getClientId() {
            let id = localStorage.getItem('client_id');
            if (!id) {
                id = 'client_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('client_id', id);
            }
            return id;
        }

        // Enviar datos a todos en la sala
        function broadcastToRoom(data) {
            const storageKey = `game_${currentRoom}`;
            const existing = localStorage.getItem(storageKey);
            let roomData = { type: 'update' };
            
            if (role === 'arena') {
                roomData = {
                    type: 'game_state',
                    players: players.map(p => ({
                        hp: p.hp,
                        connected: p.connected,
                        index: p.index,
                        color: p.color
                    }))
                };
            }
            
            // Mezclar con los datos recibidos
            if (data) {
                Object.assign(roomData, data);
            }
            
            localStorage.setItem(storageKey, JSON.stringify(roomData));
            
            // Forzar evento en el mismo documento
            setTimeout(() => {
                window.dispatchEvent(new StorageEvent('storage', {
                    key: storageKey,
                    newValue: JSON.stringify(roomData)
                }));
            }, 10);
        }

        // ========== SELECCIÓN DE ROL ==========
        window.selectRole = function(selectedRole) {
            role = selectedRole;
            document.getElementById('roleScreen').style.display = 'none';
            
            setupStorageListener();
            
            if (role === 'arena') {
                document.getElementById('arenaView').style.display = 'flex';
                initPlayers();
                setupArena();
            } else {
                document.getElementById('gamepadView').style.display = 'flex';
                setupController();
                
                // Solicitar conexión
                setTimeout(() => {
                    broadcastToRoom({
                        type: 'request_connection',
                        clientId: getClientId()
                    });
                }, 1000);
            }
        };

        // ========== INICIALIZAR JUGADORES ==========
        function initPlayers() {
            for (let i = 0; i < MAX_PLAYERS; i++) {
                players.push({
                    index: i,
                    x: playerStartPos[i].x,
                    y: playerStartPos[i].y,
                    radius: PLAYER_RADIUS,
                    color: playerColors[i],
                    hp: 100,
                    maxHp: 100,
                    angle: 0,
                    shootCooldown: 0,
                    speed: 4,
                    powerUp: null,
                    shield: false,
                    active: true,
                    connected: false,
                    moveX: 0,
                    moveY: 0,
                    shooting: false,
                    special: false
                });
            }
        }

        function assignPlayerToController(clientId) {
            for (let i = 0; i < players.length; i++) {
                if (!players[i].connected) {
                    players[i].connected = true;
                    broadcastToRoom({
                        type: 'connection_assigned',
                        clientId: clientId,
                        playerIndex: i,
                        color: players[i].color
                    });
                    
                    // Actualizar contador de jugadores
                    updatePlayerCount();
                    break;
                }
            }
        }

        function updatePlayerCount() {
            let count = 0;
            for (let p of players) {
                if (p.connected) count++;
            }
            document.getElementById('playerCount').innerText = `Jugadores: ${count}/4`;
        }

        // ========== CLASES ==========
        class Enemy {
            constructor() {
                this.radius = ENEMY_RADIUS;
                this.x = Math.random() * CANVAS_SIZE;
                this.y = Math.random() * CANVAS_SIZE;
                this.hp = 40;
                this.speed = 1.8;
                this.damage = 15;
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.radius = 15;
                this.color = type === 'rapid' ? '#ffff00' : '#00ccff';
                this.duration = 450;
            }
        }

        // ========== ARENA ==========
        function setupArena() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // Generar enemigos
            setInterval(() => {
                if (enemies.length < 8) {
                    enemies.push(new Enemy());
                }
            }, 2000);

            setInterval(() => {
                if (powerups.length < 3) {
                    const type = Math.random() > 0.5 ? 'rapid' : 'shield';
                    powerups.push(new PowerUp(
                        Math.random() * 700 + 50,
                        Math.random() * 700 + 50,
                        type
                    ));
                }
            }, 8000);

            function gameLoop() {
                if (!gameActive) return;
                updateGame();
                drawGame(ctx);
                
                // Enviar estado a controladores
                broadcastToRoom();
                
                requestAnimationFrame(gameLoop);
            }

            function updateGame() {
                for (let p of players) {
                    if (!p.active) continue;

                    // Movimiento
                    p.x += (p.moveX || 0) * p.speed;
                    p.y += (p.moveY || 0) * p.speed;
                    
                    p.x = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.x));
                    p.y = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.y));

                    // Apuntar al enemigo más cercano
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    for (let e of enemies) {
                        const dist = Math.hypot(e.x - p.x, e.y - p.y);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = e;
                        }
                    }
                    
                    if (closestEnemy) {
                        p.angle = Math.atan2(closestEnemy.y - p.y, closestEnemy.x - p.x);
                    }

                    // Disparo
                    if (p.shootCooldown <= 0) {
                        if (p.shooting && closestEnemy) {
                            bullets.push({
                                x: p.x, y: p.y,
                                vx: Math.cos(p.angle) * 8,
                                vy: Math.sin(p.angle) * 8,
                                owner: p.index,
                                radius: 5
                            });
                            p.shootCooldown = (p.powerUp?.type === 'rapid') ? 4 : 12;
                        }
                    } else {
                        p.shootCooldown--;
                    }

                    p.shield = (p.special && p.powerUp?.type === 'shield');
                }

                // Balas
                for (let i = bullets.length-1; i>=0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x < 0 || b.x > CANVAS_SIZE || b.y < 0 || b.y > CANVAS_SIZE) {
                        bullets.splice(i,1);
                        continue;
                    }
                    for (let j=enemies.length-1; j>=0; j--) {
                        let e = enemies[j];
                        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
                            e.hp -= 25;
                            bullets.splice(i,1);
                            if (e.hp <= 0) {
                                enemies.splice(j,1);
                            }
                            break;
                        }
                    }
                }

                // Enemigos
                for (let e of enemies) {
                    let target = null;
                    let minDist = Infinity;
                    for (let p of players) {
                        if (!p.active) continue;
                        const d = Math.hypot(p.x - e.x, p.y - e.y);
                        if (d < minDist) {
                            minDist = d;
                            target = p;
                        }
                    }
                    if (target) {
                        const dx = target.x - e.x;
                        const dy = target.y - e.y;
                        if (minDist > 5) {
                            e.x += (dx / minDist) * e.speed;
                            e.y += (dy / minDist) * e.speed;
                        }
                        if (minDist < e.radius + target.radius) {
                            if (!target.shield) {
                                target.hp = Math.max(0, target.hp - e.damage);
                            }
                        }
                    }
                }

                // Power-ups
                for (let i=powerups.length-1; i>=0; i--) {
                    let pu = powerups[i];
                    for (let p of players) {
                        if (!p.active) continue;
                        if (Math.hypot(pu.x - p.x, pu.y - p.y) < pu.radius + p.radius) {
                            p.powerUp = {type: pu.type, timeLeft: pu.duration};
                            powerups.splice(i,1);
                            break;
                        }
                    }
                }

                for (let p of players) {
                    if (p.powerUp) {
                        p.powerUp.timeLeft--;
                        if (p.powerUp.timeLeft <= 0) {
                            p.powerUp = null;
                            p.shield = false;
                        }
                    }
                }

                updatePlayerCount();
            }

            function drawGame(ctx) {
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Fondo
                ctx.fillStyle = '#110a1f';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Grid
                for (let i=0; i<CANVAS_SIZE; i+=40) {
                    ctx.strokeStyle = '#00ff9966';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(i,0); ctx.lineTo(i, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0,i); ctx.lineTo(CANVAS_SIZE, i);
                    ctx.stroke();
                }

                // Powerups
                for (let pu of powerups) {
                    ctx.beginPath();
                    ctx.arc(pu.x, pu.y, pu.radius, 0, 2*Math.PI);
                    ctx.fillStyle = pu.color;
                    ctx.shadowColor = pu.color;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = "bold 20px 'Courier New'";
                    ctx.fillStyle = 'white';
                    ctx.fillText(pu.type==='rapid'?'⚡':'🛡️', pu.x-15, pu.y+8);
                }

                // Enemigos
                for (let e of enemies) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, 2*Math.PI);
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'black';
                    ctx.font = "20px 'Courier New'";
                    ctx.fillText('💲', e.x-12, e.y+8);
                }

                // Jugadores
                for (let p of players) {
                    if (!p.active) continue;
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    
                    if (p.shield) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius+10, 0, 2*Math.PI);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                    
                    ctx.shadowBlur = 0;
                    
                    if (p.connected) {
                        ctx.fillStyle = '#00ff00';
                        ctx.beginPath();
                        ctx.arc(p.x-25, p.y-25, 8, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }

                // Balas
                for (let b of bullets) {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffff00';
                    ctx.fillRect(b.x-3, b.y-3, 6, 6);
                }
                ctx.shadowBlur = 0;
            }

            gameLoop();
        }

        // ========== CONTROLADOR ==========
        function setupController() {
            const joystickBase = document.getElementById('joystickBase');
            const joystickThumb = document.getElementById('joystickThumb');
            
            if (joystickBase) {
                let joystickActive = false;
                let currentMoveX = 0;
                let currentMoveY = 0;
                
                joystickBase.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                });

                joystickBase.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!joystickActive) return;
                    
                    const touch = e.touches[0];
                    const rect = joystickBase.getBoundingClientRect();
                    const centerX = rect.left + rect.width/2;
                    const centerY = rect.top + rect.height/2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const maxDist = rect.width/2;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    
                    currentMoveX = dx / maxDist;
                    currentMoveY = dy / maxDist;
                    
                    sendInput();
                });

                joystickBase.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    joystickActive = false;
                    joystickThumb.style.transform = `translate(0px, 0px)`;
                    currentMoveX = 0;
                    currentMoveY = 0;
                    sendInput();
                });
            }

            let shooting = false;
            let special = false;
            
            document.getElementById('actionShoot').addEventListener('touchstart', (e) => {
                e.preventDefault();
                shooting = true;
                sendInput();
            });
            
            document.getElementById('actionShoot').addEventListener('touchend', (e) => {
                e.preventDefault();
                shooting = false;
                sendInput();
            });
            
            document.getElementById('actionSpecial').addEventListener('touchstart', (e) => {
                e.preventDefault();
                special = true;
                sendInput();
            });
            
            document.getElementById('actionSpecial').addEventListener('touchend', (e) => {
                e.preventDefault();
                special = false;
                sendInput();
            });
            
            function sendInput() {
                if (myPlayerIndex >= 0) {
                    broadcastToRoom({
                        type: 'controller_input',
                        playerIndex: myPlayerIndex,
                        moveX: currentMoveX || 0,
                        moveY: currentMoveY || 0,
                        shooting: shooting,
                        special: special
                    });
                }
            }
        }

        function updateGamepadUI(player) {
            const healthDots = document.querySelectorAll('.health-dot');
            const healthPercent = (player.hp || 100) / 100;
            const activeDots = Math.ceil(healthPercent * 5);
            
            healthDots.forEach((dot, index) => {
                if (index < activeDots) {
                    dot.style.background = '#00ffaa';
                    dot.style.boxShadow = '0 0 10px #00ffaa';
                } else {
                    dot.style.background = '#333';
                    dot.style.boxShadow = 'none';
                }
            });
        }

        // Inicializar con código por defecto
        document.getElementById('roomCodeInput').value = 'GUARD1';
    </script>
</body>
</html>
