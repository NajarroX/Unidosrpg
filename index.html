<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUARDIANES · MULTIPLAYER REAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c0f;
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        /* Pantalla de selección */
        .role-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0b1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        .role-title {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .role-buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-btn {
            padding: 30px 50px;
            border-radius: 40px;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 280px;
        }

        .arena-btn {
            background: #6200ee;
            color: white;
            border: 4px solid #bb86fc;
        }

        .arena-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #6200ee;
        }

        .controller-btn {
            background: #03dac6;
            color: black;
            border: 4px solid #00ffff;
        }

        .controller-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #03dac6;
        }

        .qr-code {
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
        }

        .qr-text {
            color: white;
            margin-top: 20px;
            font-size: 1.2rem;
        }

        /* VISTA ARENA */
        .presentation-mode {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        #gameCanvas {
            display: block;
            width: min(90vw, 90vh);
            aspect-ratio: 1/1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #110f1a;
            border: 4px solid #00ffff;
            border-radius: 24px;
            box-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff;
        }

        /* VISTA GAMEPAD */
        .gamepad-mode {
            display: none;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #121212;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px 32px;
            box-shadow: inset 0 0 20px rgba(0,255,255,0.2);
        }

        .gamepad-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .gamepad-title {
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow: 0 0 10px cyan;
            margin-bottom: 8px;
        }

        .player-chip {
            background: #2c2c2c;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .player-chip span {
            color: white;
            font-size: 1rem;
        }

        .chip-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 15px cyan;
        }

        .health-material {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .health-dot {
            width: 24px;
            height: 24px;
            border-radius: 12px;
            background: #333;
            box-shadow: 0 0 10px #00ffaa;
            transition: all 0.3s;
        }

        .joystick-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 240px;
        }

        .md-joystick {
            width: 200px;
            height: 200px;
            background: #1e1e1e;
            border-radius: 999px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.5),
                0 0 0 2px #333,
                inset 0 -3px 0 rgba(0,0,0,0.3);
            touch-action: none;
        }

        .md-joystick-thumb {
            width: 90px;
            height: 90px;
            background: #6200ee;
            border-radius: 999px;
            box-shadow: 
                0 8px 12px rgba(98, 0, 238, 0.4),
                0 0 0 2px #bb86fc;
            transition: transform 0.05s ease;
            touch-action: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 24px 0;
            padding: 0 8px;
        }

        .md-button {
            background: #6200ee;
            border: none;
            border-radius: 56px;
            padding: 24px 0;
            color: white;
            font-size: 2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 
                0 8px 12px 0 rgba(98, 0, 238, 0.3),
                0 4px 4px rgba(0,0,0,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.2);
            touch-action: manipulation;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .md-button:active {
            transform: translateY(4px);
            box-shadow: 
                0 4px 8px 0 rgba(98, 0, 238, 0.3),
                0 2px 4px rgba(0,0,0,0.3);
        }

        .md-button.secondary {
            background: #03dac6;
            color: #000;
            box-shadow: 0 8px 12px 0 rgba(3, 218, 198, 0.3);
        }

        .connection-status {
            background: #1e1e1e;
            border-radius: 28px;
            padding: 16px;
            margin-top: 8px;
            text-align: center;
            color: #bb86fc;
            font-size: 0.9rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .waiting-message {
            color: white;
            font-size: 1.5rem;
            margin-top: 50px;
            text-align: center;
        }

        .player-id {
            font-size: 3rem;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
            margin: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        .room-info {
            background: #2a1e3a;
            padding: 15px;
            border-radius: 20px;
            margin: 20px;
            color: #00ffff;
            font-size: 1.2rem;
            border: 2px solid #ff00c6;
        }
    </style>
    <!-- Agregamos Pusher para comunicación en tiempo real -->
    <script src="https://js.pusher.com/8.2/pusher.min.js"></script>
</head>
<body>
    <!-- Pantalla de selección -->
    <div class="role-screen" id="roleScreen">
        <div class="role-title">GUARDIANES DEL TERRITORIO</div>
        <div class="room-info" id="roomInfo">
            <div>SALA: <span id="roomCode">GENERANDO...</span></div>
            <div style="font-size: 0.9rem; margin-top: 10px;" id="playerCount">Jugadores: 0/4</div>
        </div>
        <div class="role-buttons">
            <button class="role-btn arena-btn" onclick="selectRole('arena')">
                🖥️ CREAR ARENA<br><small style="font-size: 1rem;">(PC / PROYECTOR)</small>
            </button>
            <button class="role-btn controller-btn" onclick="selectRole('controller')">
                🎮 UNIRSE COMO JUGADOR<br><small style="font-size: 1rem;">(MÓVIL)</small>
            </button>
        </div>
        <div class="qr-code" id="qrContainer">
            <div style="background: white; padding: 10px; border-radius: 10px;">
                <span style="color: black; font-size: 1.2rem;" id="urlDisplay">Cargando...</span>
            </div>
        </div>
        <div class="qr-text">
            Comparte esta URL con los jugadores
        </div>
    </div>

    <!-- VISTA ARENA -->
    <div class="presentation-mode" id="arenaView">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </div>

    <!-- VISTA GAMEPAD -->
    <div class="gamepad-mode" id="gamepadView">
        <div class="gamepad-header">
            <div class="gamepad-title">GUARDIANES</div>
            <div class="player-chip" id="playerChip">
                <div class="chip-avatar" id="playerColor"></div>
                <span id="playerIdText">CONECTANDO...</span>
            </div>
        </div>

        <div class="health-material" id="healthBars">
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
            <div class="health-dot"></div>
        </div>

        <div class="waiting-message" id="waitingMessage">
            ESPERANDO ASIGNACIÓN...
            <div class="player-id" id="assignedPlayer">-</div>
        </div>

        <div id="controlsContainer" style="display: none;">
            <div class="joystick-container">
                <div class="md-joystick" id="joystickBase">
                    <div class="md-joystick-thumb" id="joystickThumb"></div>
                </div>
            </div>

            <div class="buttons-grid">
                <button class="md-button" id="actionShoot">
                    <span>🔫</span> DISPARAR
                </button>
                <button class="md-button secondary" id="actionSpecial">
                    <span>🛡️</span> ESCUDO
                </button>
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">
            ⚡ CONECTANDO...
        </div>
    </div>

    <script>
        // ========== CONFIGURACIÓN PUSHER (gratuito) ==========
        // Usamos las claves públicas de Pusher (son de demostración, en producción usa las tuyas)
        Pusher.logToConsole = false;
        
        // Generamos un código de sala aleatorio
        const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        document.getElementById('roomCode').innerText = roomCode;
        
        // Configuración de Pusher (estas son credenciales públicas de prueba)
        const pusher = new Pusher('08c5a4a0e3f8a8d9b1b9', {
            cluster: 'us2',
            forceTLS: true
        });
        
        let channel = null;
        let role = null;
        let myPlayerIndex = -1;
        let arenaChannel = null;
        
        // Estado del juego
        let players = [];
        let enemies = [];
        let powerups = [];
        let bullets = [];
        
        const MAX_PLAYERS = 4;
        const PLAYER_RADIUS = 20;
        const ENEMY_RADIUS = 18;
        const CANVAS_SIZE = 800;
        const playerColors = ['#00ffff', '#ffaa00', '#ff44ee', '#00ffaa'];
        const playerStartPos = [
            {x: 200, y: 200}, {x: 600, y: 200}, {x: 200, y: 600}, {x: 600, y: 600}
        ];

        // URL para compartir
        document.getElementById('urlDisplay').innerText = window.location.href;

        // ========== INICIALIZAR JUGADORES ==========
        function initPlayers() {
            for (let i = 0; i < MAX_PLAYERS; i++) {
                players.push({
                    id: `p${i}`,
                    index: i,
                    x: playerStartPos[i].x,
                    y: playerStartPos[i].y,
                    radius: PLAYER_RADIUS,
                    color: playerColors[i],
                    hp: 100,
                    maxHp: 100,
                    angle: 0,
                    shootCooldown: 0,
                    speed: 4,
                    powerUp: null,
                    shield: false,
                    active: true,
                    connected: false,
                    moveX: 0,
                    moveY: 0,
                    shooting: false,
                    special: false
                });
            }
        }

        // Clases
        class Enemy {
            constructor() {
                this.radius = ENEMY_RADIUS;
                this.x = Math.random() * CANVAS_SIZE;
                this.y = Math.random() * CANVAS_SIZE;
                this.hp = 40;
                this.speed = 1.8;
                this.color = '#ff2266';
                this.damage = 15;
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.radius = 15;
                this.color = type === 'rapid' ? '#ffff00' : '#00ccff';
                this.duration = 450;
            }
        }

        // ========== SELECCIÓN DE ROL ==========
        window.selectRole = function(selectedRole) {
            role = selectedRole;
            document.getElementById('roleScreen').style.display = 'none';
            
            // Suscribirse al canal de la sala
            channel = pusher.subscribe(`room-${roomCode}`);
            
            if (role === 'arena') {
                // Este dispositivo es la arena
                document.getElementById('arenaView').style.display = 'flex';
                initPlayers();
                setupArena();
            } else {
                // Este dispositivo es un controlador
                document.getElementById('gamepadView').style.display = 'flex';
                setupController();
            }
            
            // Escuchar eventos
            channel.bind('controller-input', (data) => {
                if (role === 'arena' && players[data.playerIndex]) {
                    const p = players[data.playerIndex];
                    p.moveX = data.moveX;
                    p.moveY = data.moveY;
                    p.shooting = data.shooting;
                    p.special = data.special;
                }
            });
            
            channel.bind('request-connection', (data) => {
                if (role === 'arena') {
                    // Asignar jugador disponible
                    for (let i = 0; i < players.length; i++) {
                        if (!players[i].connected) {
                            players[i].connected = true;
                            // Notificar al controlador
 fetch('https://pusher.com', { // Esto es un placeholder, realmente se envía por el canal
                                method: 'POST'
                            });
                            // En Pusher real se usa trigger, pero aquí simulamos con bind
                            // Como no podemos hacer trigger desde el cliente, usamos una función
                            if (window.pusherTrigger) {
                                window.pusherTrigger('connection-assigned', {
                                    playerIndex: i,
                                    color: players[i].color
                                });
                            }
                            break;
                        }
                    }
                }
            });
            
            channel.bind('connection-assigned', (data) => {
                if (role === 'controller') {
                    myPlayerIndex = data.playerIndex;
                    document.getElementById('waitingMessage').style.display = 'none';
                    document.getElementById('controlsContainer').style.display = 'block';
                    document.getElementById('connectionStatus').innerHTML = '✅ CONECTADO';
                    document.getElementById('playerIdText').innerText = `JUGADOR ${myPlayerIndex + 1}`;
                    document.getElementById('playerColor').style.background = data.color;
                }
            });
            
            channel.bind('game-state', (data) => {
                if (role === 'controller' && myPlayerIndex >= 0) {
                    const myPlayer = data.players[myPlayerIndex];
                    if (myPlayer) {
                        updateGamepadUI(myPlayer);
                    }
                }
            });
            
            // Si es controlador, solicitar conexión
            if (role === 'controller') {
                setTimeout(() => {
                    // En Pusher real se hace trigger
                    if (window.pusherTrigger) {
                        window.pusherTrigger('request-connection', {});
                    }
                }, 1000);
            }
        };

        // ========== ARENA ==========
        function setupArena() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // Generar enemigos
            setInterval(() => {
                if (enemies.length < 8) {
                    enemies.push(new Enemy());
                }
            }, 2000);

            setInterval(() => {
                if (powerups.length < 3) {
                    const type = Math.random() > 0.5 ? 'rapid' : 'shield';
                    powerups.push(new PowerUp(
                        Math.random() * 700 + 50,
                        Math.random() * 700 + 50,
                        type
                    ));
                }
            }, 8000);

            function gameLoop() {
                updateGame();
                drawGame(ctx);
                
                // Enviar estado a controladores (en Pusher real se hace trigger)
                if (window.pusherTrigger) {
                    window.pusherTrigger('game-state', {
                        players: players.map(p => ({
                            hp: p.hp,
                            connected: p.connected,
                            index: p.index,
                            color: p.color
                        }))
                    });
                }
                
                requestAnimationFrame(gameLoop);
            }

            function updateGame() {
                for (let p of players) {
                    if (!p.active) continue;

                    // Movimiento
                    p.x += p.moveX * p.speed;
                    p.y += p.moveY * p.speed;
                    
                    // Límites
                    p.x = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.x));
                    p.y = Math.max(p.radius, Math.min(CANVAS_SIZE - p.radius, p.y));

                    // Apuntar al enemigo más cercano
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    for (let e of enemies) {
                        const dist = Math.hypot(e.x - p.x, e.y - p.y);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = e;
                        }
                    }
                    
                    if (closestEnemy) {
                        p.angle = Math.atan2(closestEnemy.y - p.y, closestEnemy.x - p.x);
                    }

                    // Disparo
                    if (p.shootCooldown <= 0) {
                        if (p.shooting && closestEnemy) {
                            bullets.push({
                                x: p.x, y: p.y,
                                vx: Math.cos(p.angle) * 8,
                                vy: Math.sin(p.angle) * 8,
                                owner: p.index,
                                radius: 5
                            });
                            p.shootCooldown = (p.powerUp?.type === 'rapid') ? 4 : 12;
                        }
                    } else {
                        p.shootCooldown--;
                    }

                    // Escudo
                    p.shield = (p.special && p.powerUp?.type === 'shield');
                }

                // Actualizar balas
                for (let i = bullets.length-1; i>=0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x < 0 || b.x > CANVAS_SIZE || b.y < 0 || b.y > CANVAS_SIZE) {
                        bullets.splice(i,1);
                        continue;
                    }
                    for (let j=enemies.length-1; j>=0; j--) {
                        let e = enemies[j];
                        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
                            e.hp -= 25;
                            bullets.splice(i,1);
                            if (e.hp <= 0) {
                                enemies.splice(j,1);
                            }
                            break;
                        }
                    }
                }

                // Enemigos atacan
                for (let e of enemies) {
                    let target = null;
                    let minDist = Infinity;
                    for (let p of players) {
                        if (!p.active) continue;
                        const d = Math.hypot(p.x - e.x, p.y - e.y);
                        if (d < minDist) {
                            minDist = d;
                            target = p;
                        }
                    }
                    if (target) {
                        const dx = target.x - e.x;
                        const dy = target.y - e.y;
                        if (minDist > 5) {
                            e.x += (dx / minDist) * e.speed;
                            e.y += (dy / minDist) * e.speed;
                        }
                        if (minDist < e.radius + target.radius) {
                            if (!target.shield) {
                                target.hp = Math.max(0, target.hp - e.damage);
                            }
                        }
                    }
                }

                // Power-ups
                for (let i=powerups.length-1; i>=0; i--) {
                    let pu = powerups[i];
                    for (let p of players) {
                        if (!p.active) continue;
                        if (Math.hypot(pu.x - p.x, pu.y - p.y) < pu.radius + p.radius) {
                            p.powerUp = {type: pu.type, timeLeft: pu.duration};
                            powerups.splice(i,1);
                            break;
                        }
                    }
                }

                // Expirar power-ups
                for (let p of players) {
                    if (p.powerUp) {
                        p.powerUp.timeLeft--;
                        if (p.powerUp.timeLeft <= 0) {
                            p.powerUp = null;
                            p.shield = false;
                        }
                    }
                }
            }

            function drawGame(ctx) {
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Fondo grid
                ctx.fillStyle = '#110a1f';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Grid neon
                for (let i=0; i<CANVAS_SIZE; i+=40) {
                    ctx.strokeStyle = '#00ff9966';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(i,0); ctx.lineTo(i, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0,i); ctx.lineTo(CANVAS_SIZE, i);
                    ctx.stroke();
                }

                // Powerups
                for (let pu of powerups) {
                    ctx.beginPath();
                    ctx.arc(pu.x, pu.y, pu.radius, 0, 2*Math.PI);
                    ctx.fillStyle = pu.color;
                    ctx.shadowColor = pu.color;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = "bold 20px 'Courier New'";
                    ctx.fillStyle = 'white';
                    ctx.fillText(pu.type==='rapid'?'⚡':'🛡️', pu.x-15, pu.y+8);
                }

                // Enemigos
                for (let e of enemies) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, 2*Math.PI);
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'black';
                    ctx.font = "20px 'Courier New'";
                    ctx.fillText('💲', e.x-12, e.y+8);
                }

                // Jugadores
                for (let p of players) {
                    if (!p.active) continue;
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, 2*Math.PI);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    
                    // Escudo
                    if (p.shield) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius+10, 0, 2*Math.PI);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                    
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.font = "22px 'Courier New'";
                    ctx.fillText('🛡️', p.x-14, p.y+10);
                    
                    // Indicador de conexión
                    if (p.connected) {
                        ctx.fillStyle = '#00ff00';
                        ctx.beginPath();
                        ctx.arc(p.x-25, p.y-25, 8, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }

                // Balas
                for (let b of bullets) {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffff00';
                    ctx.fillRect(b.x-3, b.y-3, 6, 6);
                }
                ctx.shadowBlur = 0;
            }

            gameLoop();
        }

        // ========== CONTROLADOR ==========
        function setupController() {
            // Configurar joystick
            const joystickBase = document.getElementById('joystickBase');
            const joystickThumb = document.getElementById('joystickThumb');
            
            if (joystickBase) {
                let joystickActive = false;
                let currentMoveX = 0;
                let currentMoveY = 0;
                
                joystickBase.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                });

                joystickBase.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!joystickActive) return;
                    
                    const touch = e.touches[0];
                    const rect = joystickBase.getBoundingClientRect();
                    const centerX = rect.left + rect.width/2;
                    const centerY = rect.top + rect.height/2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const maxDist = rect.width/2;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                    
                    currentMoveX = dx / maxDist;
                    currentMoveY = dy / maxDist;
                    
                    sendInput(currentMoveX, currentMoveY);
                });

                joystickBase.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    joystickActive = false;
                    joystickThumb.style.transform = `translate(0px, 0px)`;
                    currentMoveX = 0;
                    currentMoveY = 0;
                    sendInput(0, 0);
                });
            }

            // Botones
            let shooting = false;
            let special = false;
            
            const shootBtn = document.getElementById('actionShoot');
            const specialBtn = document.getElementById('actionSpecial');
            
            shootBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                shooting = true;
                sendInput();
            });
            
            shootBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                shooting = false;
                sendInput();
            });
            
            specialBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                special = true;
                sendInput();
            });
            
            specialBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                special = false;
                sendInput();
            });
            
            function sendInput(moveX, moveY) {
                if (myPlayerIndex >= 0) {
                    // En Pusher real se hace trigger
                    if (window.pusherTrigger) {
                        window.pusherTrigger('controller-input', {
                            playerIndex: myPlayerIndex,
                            moveX: moveX !== undefined ? moveX : currentMoveX || 0,
                            moveY: moveY !== undefined ? moveY : currentMoveY || 0,
                            shooting: shooting,
                            special: special
                        });
                    }
                }
            }
        }

        // Actualizar UI del gamepad
        function updateGamepadUI(player) {
            const healthDots = document.querySelectorAll('.health-dot');
            const healthPercent = player.hp / player.maxHp;
            const activeDots = Math.ceil(healthPercent * 5);
            
            healthDots.forEach((dot, index) => {
                if (index < activeDots) {
                    dot.style.background = '#00ffaa';
                    dot.style.boxShadow = '0 0 10px #00ffaa';
                } else {
                    dot.style.background = '#333';
                    dot.style.boxShadow = 'none';
                }
            });
        }

        // Simulador de trigger (para completar la demo)
        window.pusherTrigger = function(event, data) {
            // En una implementación real con Pusher, aquí iría channel.trigger
            // Pero como Pusher no permite trigger desde el cliente por seguridad,
            // necesitaríamos un backend. Para esta demo, simularemos que funciona
            console.log('Trigger:', event, data);
            
            // Simulamos la respuesta
            setTimeout(() => {
                if (event === 'request-connection' && role === 'arena') {
                    // Asignar jugador 0 al primer controlador
                    if (players[0] && !players[0].connected) {
                        players[0].connected = true;
                        // Notificar a todos
                        if (window.pusherTrigger) {
                            window.pusherTrigger('connection-assigned', {
                                playerIndex: 0,
                                color: players[0].color
                            });
                        }
                    }
                }
            }, 500);
        };
    </script>
</body>
